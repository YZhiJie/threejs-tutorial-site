    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：老板要「数字孪生」</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="210" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">老板要「数字孪生大屏」，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">我以为得建模三个月！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#94a3b8">晨会需求拆解，每一条都像三个月：</text>
    <rect x="36" y="182" width="246" height="32" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="159" y="203" text-anchor="middle" font-size="13" fill="#e2e8f0">① 园区 3D 建模？</text>
    <rect x="294" y="182" width="246" height="32" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="417" y="203" text-anchor="middle" font-size="13" fill="#e2e8f0">② 实时数据刷新？</text>
    <rect x="36" y="222" width="246" height="32" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="159" y="243" text-anchor="middle" font-size="13" fill="#e2e8f0">③ 告警定位飞行？</text>
    <rect x="294" y="222" width="246" height="32" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <text x="417" y="243" text-anchor="middle" font-size="13" fill="#e2e8f0">④ 扫描特效拉满？</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">三个月？码叔笑而不语：</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">你的工具箱里，零件早就各就各位了。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：大屏是四层拼装</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="180" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">大屏不是建出来的，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">是拼出来的——四层。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="36" y="160" width="500" height="21" rx="6" fill="#111a30" stroke="#1e2a44"/>
    <text x="48" y="175" font-size="12" fill="#e2e8f0">UI 层　｜　HTML 标题栏、告警面板</text>
    <rect x="36" y="184" width="500" height="21" rx="6" fill="#111a30" stroke="#1e2a44"/>
    <text x="48" y="199" font-size="12" fill="#e2e8f0">特效层　｜　⑫ 扫描线 ＋ ⑬ 泛光</text>
    <rect x="36" y="208" width="500" height="21" rx="6" fill="#111a30" stroke="#1e2a44"/>
    <text x="48" y="223" font-size="12" fill="#e2e8f0">标注层　｜　21.2 CSS2D 与实例化标牌</text>
    <rect x="36" y="232" width="500" height="21" rx="6" fill="#111a30" stroke="#1e2a44"/>
    <text x="48" y="247" font-size="12" fill="#e2e8f0">底图层　｜　⑯ 实例化城市，一次 draw call</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">各层各司其职，零件全部来自前面模块；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">分层架构就是你的装配图。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：一天拼出园区</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
