    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="195" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">一天拼出园区 Demo，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">告警一飞老板鼓掌！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="178" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">setInterval(pushAlarm, 2400)</text>
    <text x="38" y="200" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">item.onclick = () =&gt; flyToBuilding(b)</text>
    <text x="38" y="222" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">city.setColorAt(id, RED)</text>
    <text x="38" y="244" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 一天交付 · draw calls 仍是个位数</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">楼群变红、列表刷新、相机起飞——</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">三层联动，靠的是数据流动，不是魔法。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
