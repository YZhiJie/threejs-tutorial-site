<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg30" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad30" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg30)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.30</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad30)">把数字翻译成高度</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad30)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：柱子从半空起算</text>

    <g transform="translate(52,96)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,90 74,96 88,102" fill="#f8fafc"/>
    <rect x="88" y="68" width="250" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="90" font-size="15" fill="#0b1220">柱子抬高后，差距真明显！</text>
    <text x="102" y="112" font-size="15" fill="#0b1220">这才叫有冲击力嘛。</text>

    <g transform="translate(52,175)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-13,-19 L-8,-5 L-3,-22 L2,-5 L8,-19 L12,-5 L16,-2 Q0,-12 -16,-2 Z" fill="#334155"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,5 q4,4 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,169 74,175 88,181" fill="#f8fafc"/>
    <rect x="88" y="147" width="226" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="169" font-size="15" fill="#0b1220">起点不是 0，高度还准吗？</text>
    <text x="102" y="191" font-size="15" fill="#0b1220">这根到底代表多少？</text>

    <text x="24" y="206" font-size="10.5" fill="#94a3b8">柱子底部悬在截断基线上（起点 ≠ 0）</text>
    <rect x="24" y="212" width="524" height="74" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.28"/>
    <rect x="56" y="224" width="56" height="28" rx="3" fill="#22d3ee"/>
    <rect x="136" y="212" width="56" height="40" rx="3" fill="#a78bfa"/>
    <rect x="216" y="202" width="56" height="50" rx="3" fill="#f472b6"/>
    <rect x="296" y="220" width="56" height="32" rx="3" fill="#fbbf24"/>
    <rect x="376" y="208" width="56" height="44" rx="3" fill="#34d399"/>
    <rect x="456" y="218" width="56" height="34" rx="3" fill="#60a5fa"/>
    <line x1="48" y1="252" x2="520" y2="252" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.75"/>
    <line x1="48" y1="276" x2="520" y2="276" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.7"/>
    <text x="48" y="289" font-size="10" fill="#94a3b8">真实 0 基线</text>

    <rect x="24" y="294" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="294" width="4" height="50" rx="2" fill="#f97316"/>
    <text x="40" y="315" font-size="13.5" fill="#e2e8f0">起点不是 0，柱子长度就不再与数值成正比；</text>
    <text x="40" y="335" font-size="13.5" fill="#94a3b8">差距被放大的同时，倍数关系也被改写了。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：把数据翻译成通道</text>

    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,104 74,110 88,116" fill="#f8fafc"/>
    <rect x="88" y="82" width="238" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">先定映射，再画形状。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">图表也有自己的语法。</text>

    <rect x="24" y="152" width="524" height="40" rx="7" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <rect x="38" y="166" width="13" height="13" rx="2" fill="#22d3ee"/>
    <rect x="56" y="166" width="13" height="13" rx="2" fill="#a78bfa"/>
    <rect x="74" y="166" width="13" height="13" rx="2" fill="#f472b6"/>
    <text x="102" y="178" font-size="13.5" fill="#e2e8f0">位置：放类别轴与空间关系</text>

    <rect x="24" y="196" width="524" height="40" rx="7" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="38" y="214" width="10" height="12" rx="2" fill="#22d3ee"/>
    <rect x="52" y="207" width="10" height="19" rx="2" fill="#a78bfa"/>
    <rect x="66" y="210" width="10" height="16" rx="2" fill="#f472b6"/>
    <text x="102" y="222" font-size="13.5" fill="#e2e8f0">高度：放数值，统一比例尺、从 0 起算</text>

    <rect x="24" y="240" width="524" height="40" rx="7" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <circle cx="44" cy="260" r="6" fill="#22d3ee"/>
    <circle cx="61" cy="260" r="6" fill="#fbbf24"/>
    <circle cx="78" cy="260" r="6" fill="#f97316"/>
    <text x="102" y="266" font-size="13.5" fill="#e2e8f0">颜色：分类 / 连续 / 发散，必须配标签</text>

    <rect x="24" y="292" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="292" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="313" font-size="13.5" fill="#e2e8f0">通道精度：位置 &gt; 长度 &gt; 面积 &gt; 颜色；</text>
    <text x="40" y="333" font-size="13.5" fill="#94a3b8">能用高度表达时，别只靠颜色说话。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：同一份数据三种说法</text>

    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,104 74,110 88,116" fill="#f8fafc"/>
    <rect x="88" y="82" width="248" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">同一份数据，能讲成三种句子。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">选错形态，调色也救不回来。</text>

    <rect x="24" y="148" width="164" height="132" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <rect x="50" y="216" width="22" height="30" rx="2" fill="#22d3ee"/>
    <rect x="84" y="200" width="22" height="46" rx="2" fill="#a78bfa"/>
    <rect x="118" y="208" width="22" height="38" rx="2" fill="#f472b6"/>
    <rect x="152" y="190" width="22" height="56" rx="2" fill="#fbbf24"/>
    <line x1="42" y1="246" x2="172" y2="246" stroke="#334155" stroke-width="1.2"/>
    <text x="106" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#7dd3fc">柱状 · 比大小</text>

    <rect x="200" y="148" width="164" height="132" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <circle cx="230" cy="230" r="4" fill="#22d3ee"/>
    <circle cx="250" cy="210" r="4" fill="#a78bfa"/>
    <circle cx="270" cy="238" r="4" fill="#f472b6"/>
    <circle cx="290" cy="200" r="4" fill="#fbbf24"/>
    <circle cx="310" cy="225" r="4" fill="#34d399"/>
    <circle cx="330" cy="245" r="4" fill="#60a5fa"/>
    <text x="282" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#c4b5fd">散点 · 看关系</text>

    <rect x="376" y="148" width="164" height="132" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <path d="M392,236 Q420,196 448,220 T504,198" stroke="#f472b6" stroke-width="2" fill="none"/>
    <path d="M392,246 Q420,214 448,234 T504,214" stroke="#22d3ee" stroke-width="2" fill="none"/>
    <path d="M392,254 Q420,232 448,248 T504,232" stroke="#a78bfa" stroke-width="2" fill="none"/>
    <text x="458" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#f9a8d4">曲面 · 看趋势</text>

    <rect x="24" y="290" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="311" font-size="13.5" fill="#e2e8f0">3D 饼图：角度被透视压缩，扇区还会互相遮挡；</text>
    <text x="40" y="331" font-size="13.5" fill="#94a3b8">要比占比，请回到 2D 条形图。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三条图表纪律</text>

    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,104 74,110 88,116" fill="#f8fafc"/>
    <rect x="88" y="82" width="226" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">语法对了，颜色才有意义。</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">否则只是更花哨的误读。</text>

    <rect x="24" y="170" width="96" height="26" rx="13" fill="#22d3ee"/>
    <text x="72" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b1220">0 基线</text>
    <text x="132" y="188" font-size="13.5" fill="#e2e8f0">所有柱子共用比例尺，从 0 长出</text>

    <rect x="24" y="212" width="96" height="26" rx="13" fill="#f472b6"/>
    <text x="72" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b1220">色板</text>
    <text x="132" y="230" font-size="13.5" fill="#e2e8f0">分类不超 8 种，颜色必须配标签</text>

    <rect x="24" y="254" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0b1220">3D</text>
    <text x="132" y="272" font-size="13.5" fill="#e2e8f0">第三个维度真有用时，才上场</text>

    <rect x="24" y="296" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="317" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="337" font-size="13.5" fill="#e2e8f0">先问问题，再选形态，最后才调颜色。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.30</text>
</svg>
