<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111a29"/>
      <stop offset="1" stop-color="#0b101a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatBlue">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatCyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatYellow">
      <stop offset="0" stop-color="#facc15" stop-opacity=".92"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heatRed">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="840" fill="url(#bg)"/>
  <ellipse cx="260" cy="6" rx="420" ry="96" fill="url(#glow)"/>

  <text x="42" y="34" font-size="13" fill="#22d3ee" letter-spacing="3">THREE.JS 性能剧场 · EP.26</text>
  <text x="42" y="69" font-size="26" font-weight="700" fill="#e6edf3">每个像素都在偷偷加班</text>
  <text x="1158" y="40" font-size="12" fill="#64748b" text-anchor="end">26.2 · OVERDRAW / BANDWIDTH</text>

  <g transform="translate(20,84)">
    <rect x="0" y="0" width="572" height="361" rx="18" fill="url(#panelFill)" stroke="#24314a" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="361" rx="3" fill="#22d3ee"/>
    <rect x="18" y="18" width="30" height="30" rx="8" fill="#22d3ee"/>
    <text x="33" y="39" font-size="16" font-weight="700" fill="#06121b" text-anchor="middle">1</text>
    <text x="60" y="42" font-size="20" font-weight="700" fill="#e6edf3">困境：一开雾效就掉帧</text>

    <g transform="translate(54,98)">
      <circle cx="0" cy="0" r="17" fill="#ffd9c0"/>
      <path d="M-18,-3 Q-20,-24 0,-25 Q20,-24 18,-3 Q14,-12 8,-14 Q2,-18 -4,-13 Q-12,-12 -16,-3 Z" fill="#f97316"/>
      <path d="M14,-21 Q27,-23 25,-7 Q20,-9 16,-13 Z" fill="#f97316"/>
      <circle cx="-6" cy="-1" r="2" fill="#111827"/>
      <circle cx="6" cy="-1" r="2" fill="#111827"/>
      <path d="M-3,6 Q0,9 3,6" stroke="#b45309" stroke-width="1.4" fill="none"/>
      <rect x="-15" y="17" width="30" height="26" rx="7" fill="#6d28d9"/>
      <rect x="-9" y="22" width="18" height="3" rx="1.5" fill="#a78bfa"/>
    </g>
    <rect x="86" y="68" width="300" height="56" rx="12" fill="#16233a" stroke="#2b3d5c"/>
    <text x="100" y="92" font-size="14" fill="#dbeafe">同样的场景，一开雾就卡。</text>
    <text x="100" y="112" font-size="14" fill="#dbeafe">帧率 55 降到 24，鼠标还发飘。</text>

    <g transform="translate(54,186)">
      <circle cx="0" cy="0" r="17" fill="#ffe0cf"/>
      <path d="M-18,-4 L-14,-20 L-8,-10 L-3,-24 L2,-11 L8,-23 L12,-9 L17,-18 L18,-3 Q10,-9 0,-10 Q-10,-9 -18,-3 Z" fill="#22d3ee"/>
      <circle cx="-6" cy="-1" r="2" fill="#111827"/>
      <circle cx="6" cy="-1" r="2" fill="#111827"/>
      <rect x="-15" y="17" width="30" height="26" rx="7" fill="#1d4ed8"/>
    </g>
    <rect x="86" y="158" width="316" height="54" rx="12" fill="#16233a" stroke="#2b3d5c"/>
    <text x="100" y="181" font-size="14" fill="#dbeafe">粒子一多，画面像在拖影。</text>
    <text x="100" y="201" font-size="14" fill="#dbeafe">到底是谁在偷偷加班？</text>

    <rect x="24" y="242" width="524" height="70" rx="10" fill="#0a1220" stroke="#1e2c44"/>
    <text x="40" y="266" font-size="12.5" fill="#7dd3fc" font-family="monospace">frame   34.6 ms   budget 16.6 ms</text>
    <text x="40" y="286" font-size="12.5" fill="#7dd3fc" font-family="monospace">fps     24       draw calls 12</text>
    <text x="40" y="306" font-size="12.5" fill="#f472b6" font-family="monospace">雾效 1 层  overdraw 4.2x  片元 82MP</text>
    <text x="24" y="340" font-size="13.5" fill="#94a3b8">看起来只多了一层雾，代价却翻了好几倍。</text>
  </g>

  <g transform="translate(608,84)">
    <rect x="0" y="0" width="572" height="361" rx="18" fill="url(#panelFill)" stroke="#24314a" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="361" rx="3" fill="#a78bfa"/>
    <rect x="18" y="18" width="30" height="30" rx="8" fill="#a78bfa"/>
    <text x="33" y="39" font-size="16" font-weight="700" fill="#0b1020" text-anchor="middle">2</text>
    <text x="60" y="42" font-size="20" font-weight="700" fill="#e6edf3">揭秘：同一像素画了几次</text>

    <g transform="translate(54,96)">
      <circle cx="0" cy="0" r="17" fill="#ffe0cf"/>
      <path d="M-18,-4 Q-20,-24 0,-25 Q20,-24 18,-4 Q10,-10 0,-11 Q-10,-10 -18,-4 Z" fill="#9ca3af"/>
      <circle cx="-7" cy="0" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
      <circle cx="7" cy="0" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
      <line x1="-1" y1="0" x2="1" y2="0" stroke="#e2e8f0" stroke-width="1.6"/>
      <path d="M-8,9 Q0,15 8,9 Q0,19 -8,9 Z" fill="#d1d5db"/>
      <rect x="-15" y="17" width="30" height="26" rx="7" fill="#334155"/>
    </g>
    <rect x="86" y="66" width="322" height="56" rx="12" fill="#1a1f33" stroke="#3b3d5c"/>
    <text x="100" y="90" font-size="14" fill="#e9d5ff">overdraw：这个像素被画了几次。</text>
    <text x="100" y="110" font-size="14" fill="#e9d5ff">不是看可见层数，是看着色次数。</text>

    <rect x="24" y="144" width="112" height="74" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45"/>
    <rect x="54" y="166" width="112" height="74" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45"/>
    <rect x="84" y="188" width="112" height="74" rx="10" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".45"/>
    <text x="30" y="162" font-size="12" fill="#67e8f9">1</text>
    <text x="60" y="184" font-size="12" fill="#67e8f9">2</text>
    <text x="90" y="206" font-size="12" fill="#67e8f9">3</text>
    <circle cx="108" cy="214" r="9" fill="none" stroke="#f472b6" stroke-width="1.6"/>

    <text x="232" y="172" font-size="14" fill="#cbd5e1">第 1 层：着色 1 次</text>
    <text x="232" y="198" font-size="14" fill="#cbd5e1">第 2 层：着色 2 次</text>
    <text x="232" y="224" font-size="14" fill="#cbd5e1">第 3 层：着色 3 次</text>
    <text x="232" y="252" font-size="14" fill="#f472b6">同一像素，重复付费。</text>

    <rect x="24" y="280" width="524" height="58" rx="10" fill="#0a1220" stroke="#1e2c44"/>
    <text x="40" y="302" font-size="12.5" fill="#7dd3fc" font-family="monospace">gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);</text>
    <text x="40" y="322" font-size="12.5" fill="#7dd3fc" font-family="monospace">blending: THREE.AdditiveBlending</text>
    <text x="24" y="354" font-size="13.5" fill="#94a3b8">一次重叠，就是一次额外的片元着色。</text>
  </g>

  <g transform="translate(20,462)">
    <rect x="0" y="0" width="572" height="361" rx="18" fill="url(#panelFill)" stroke="#24314a" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="361" rx="3" fill="#f472b6"/>
    <rect x="18" y="18" width="30" height="30" rx="8" fill="#f472b6"/>
    <text x="33" y="39" font-size="16" font-weight="700" fill="#12060d" text-anchor="middle">3</text>
    <text x="60" y="42" font-size="20" font-weight="700" fill="#e6edf3">实证：把层数画成颜色</text>

    <g transform="translate(54,96)">
      <circle cx="0" cy="0" r="17" fill="#ffd9c0"/>
      <path d="M-18,-3 Q-20,-24 0,-25 Q20,-24 18,-3 Q14,-12 8,-14 Q2,-18 -4,-13 Q-12,-12 -16,-3 Z" fill="#f97316"/>
      <path d="M14,-21 Q27,-23 25,-7 Q20,-9 16,-13 Z" fill="#f97316"/>
      <circle cx="-6" cy="-1" r="2" fill="#111827"/>
      <circle cx="6" cy="-1" r="2" fill="#111827"/>
      <path d="M-3,6 Q0,9 3,6" stroke="#b45309" stroke-width="1.4" fill="none"/>
      <rect x="-15" y="17" width="30" height="26" rx="7" fill="#6d28d9"/>
      <rect x="-9" y="22" width="18" height="3" rx="1.5" fill="#a78bfa"/>
    </g>
    <rect x="86" y="64" width="312" height="54" rx="12" fill="#231726" stroke="#5c2b45"/>
    <text x="100" y="87" font-size="14" fill="#fbcfe8">切到热力图，红色就是重灾区！</text>
    <text x="100" y="107" font-size="14" fill="#fbcfe8">越红，说明同一像素被画得越多。</text>

    <circle cx="32" cy="143" r="5" fill="#1d4ed8"/>
    <text x="44" y="147" font-size="13" fill="#cbd5e1">蓝：1 次</text>
    <circle cx="32" cy="169" r="5" fill="#06b6d4"/>
    <text x="44" y="173" font-size="13" fill="#cbd5e1">青：2 次</text>
    <circle cx="32" cy="195" r="5" fill="#facc15"/>
    <text x="44" y="199" font-size="13" fill="#cbd5e1">黄：4 次</text>
    <circle cx="32" cy="221" r="5" fill="#ef4444"/>
    <text x="44" y="225" font-size="13" fill="#cbd5e1">红：6 次以上</text>

    <text x="24" y="256" font-size="14" fill="#e2e8f0">平均 overdraw 4.2 倍</text>
    <text x="24" y="278" font-size="14" fill="#f472b6">片元 82 MP vs 基准 19 MP</text>

    <rect x="292" y="132" width="256" height="150" rx="10" fill="#050810" stroke="#1e293b"/>
    <circle cx="352" cy="198" r="62" fill="url(#heatBlue)"/>
    <circle cx="424" cy="186" r="50" fill="url(#heatCyan)"/>
    <circle cx="466" cy="214" r="34" fill="url(#heatYellow)"/>
    <circle cx="486" cy="226" r="19" fill="url(#heatRed)"/>
    <circle cx="336" cy="164" r="26" fill="url(#heatCyan)"/>
    <text x="292" y="298" font-size="11.5" fill="#64748b">overdraw 热力图（按着色次数上色）</text>

    <text x="24" y="336" font-size="13.5" fill="#94a3b8">overdraw 是乘法：层数与像素数同时放大。</text>
  </g>

  <g transform="translate(608,462)">
    <rect x="0" y="0" width="572" height="361" rx="18" fill="url(#panelFill)" stroke="#24314a" stroke-width="1.2"/>
    <rect x="0" y="0" width="6" height="361" rx="3" fill="#34d399"/>
    <rect x="18" y="18" width="30" height="30" rx="8" fill="#34d399"/>
    <text x="33" y="39" font-size="16" font-weight="700" fill="#06140f" text-anchor="middle">4</text>
    <text x="60" y="42" font-size="20" font-weight="700" fill="#e6edf3">结案：三刀砍掉过度绘制</text>

    <g transform="translate(54,96)">
      <circle cx="0" cy="0" r="17" fill="#ffe0cf"/>
      <path d="M-18,-4 Q-20,-24 0,-25 Q20,-24 18,-4 Q10,-10 0,-11 Q-10,-10 -18,-4 Z" fill="#9ca3af"/>
      <circle cx="-7" cy="0" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
      <circle cx="7" cy="0" r="6" fill="none" stroke="#e2e8f0" stroke-width="1.6"/>
      <line x1="-1" y1="0" x2="1" y2="0" stroke="#e2e8f0" stroke-width="1.6"/>
      <path d="M-8,9 Q0,15 8,9 Q0,19 -8,9 Z" fill="#d1d5db"/>
      <rect x="-15" y="17" width="30" height="26" rx="7" fill="#334155"/>
    </g>
    <rect x="86" y="64" width="304" height="52" rx="12" fill="#12241d" stroke="#256b4a"/>
    <text x="100" y="86" font-size="14" fill="#a7f3d0">先量，再砍，一次只砍一处。</text>
    <text x="100" y="106" font-size="14" fill="#a7f3d0">别拿降 DPR 当万能药。</text>

    <rect x="24" y="158" width="24" height="24" rx="6" fill="#22d3ee"/>
    <text x="36" y="175" font-size="14" font-weight="700" fill="#06121b" text-anchor="middle">1</text>
    <text x="60" y="175" font-size="14" fill="#cbd5e1">大面积半透明改为加法混合</text>

    <rect x="24" y="194" width="24" height="24" rx="6" fill="#a78bfa"/>
    <text x="36" y="211" font-size="14" font-weight="700" fill="#0b1020" text-anchor="middle">2</text>
    <text x="60" y="211" font-size="14" fill="#cbd5e1">每个后处理 Pass 都是一次全屏读写</text>

    <rect x="24" y="230" width="24" height="24" rx="6" fill="#f472b6"/>
    <text x="36" y="247" font-size="14" font-weight="700" fill="#12060d" text-anchor="middle">3</text>
    <text x="60" y="247" font-size="14" fill="#cbd5e1">单通道数据别用 RGBA 硬存</text>

    <rect x="24" y="268" width="524" height="64" rx="12" fill="#0c1a17" stroke="#1f4d3d"/>
    <text x="40" y="294" font-size="15" font-weight="700" fill="#6ee7b7">看得见的层数，才谈得上砍掉。</text>
    <text x="40" y="316" font-size="13" fill="#94a3b8">先用热力图定位，再按层数与 Pass 逐项削减。</text>
  </g>
</svg>
