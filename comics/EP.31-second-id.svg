<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg31" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad31" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gpu31" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg31)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.31</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad31)">GPU 的第二张身份证</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad31)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：要不要重写项目</text>

    <g transform="translate(52,98)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,88 74,94 88,100" fill="#f8fafc"/>
    <rect x="88" y="70" width="250" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="92" font-size="15" fill="#0b1220">老板说 WebGPU 要来了，</text>
    <text x="102" y="114" font-size="15" fill="#0b1220">项目是不是要重写？</text>

    <g transform="translate(52,178)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-2,-12 -16,-12 q-14,0 -16,12 z" fill="#334155"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,168 74,174 88,180" fill="#f8fafc"/>
    <rect x="88" y="150" width="236" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="172" font-size="15" fill="#0b1220">先别慌，先探测一下，</text>
    <text x="102" y="194" font-size="15" fill="#0b1220">再决定也不迟。</text>

    <rect x="24" y="220" width="524" height="56" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="243" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">navigator.gpu -&gt; adapter -&gt; device</text>
    <text x="38" y="263" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">verdict: WebGPU ready / WebGL2 fallback</text>

    <rect x="24" y="292" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="292" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="314" font-size="13.5" fill="#e2e8f0">旧项目不必推倒重来：先看设备能力，再看需求。</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">WebGL 与 WebGPU 会长期共存，不是二选一。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：换的是底盘</text>

    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="90" width="250" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="112" font-size="15" fill="#0b1220">这不是换轮胎，</text>
    <text x="102" y="134" font-size="15" fill="#0b1220">是换一套底盘。</text>

    <rect x="24" y="150" width="524" height="98" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="32" y="164" width="248" height="32" rx="6" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="44" y="185" font-size="13" fill="#e2e8f0">全局状态 → 管线对象</text>
    <rect x="292" y="164" width="248" height="32" rx="6" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="304" y="185" font-size="13" fill="#e2e8f0">隐式绑定 → bind group</text>
    <rect x="32" y="204" width="248" height="32" rx="6" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="44" y="225" font-size="13" fill="#e2e8f0">GLSL → WGSL</text>
    <rect x="292" y="204" width="248" height="32" rx="6" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="304" y="225" font-size="13" fill="#e2e8f0">同步创建 → 异步初始化</text>

    <rect x="24" y="256" width="524" height="42" rx="8" fill="#0a0f1c" stroke="#34d399" stroke-opacity="0.32"/>
    <text x="38" y="276" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">Scene / Mesh / Material 保持不变</text>
    <text x="38" y="292" font-size="12" fill="#34d399" font-family="'SF Mono',Consolas,monospace">renderer = WebGPURenderer + await init()</text>

    <rect x="24" y="306" width="524" height="44" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="306" width="4" height="44" rx="2" fill="#a78bfa"/>
    <text x="40" y="326" font-size="13.5" fill="#e2e8f0">标准材质会自动转成 NodeMaterial，业务代码改动很小。</text>
    <text x="40" y="344" font-size="13.5" fill="#94a3b8">自定义 GLSL 才是迁移成本的大头。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：能力探测台</text>

    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="90" width="250" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="112" font-size="15" fill="#0b1220">我这边探测到，</text>
    <text x="102" y="134" font-size="15" fill="#0b1220">WebGPU 可用！</text>

    <rect x="24" y="150" width="524" height="118" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">adapter.info · Apple M2</text>
    <text x="38" y="192" font-size="11.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">maxTextureDimension2D      16384</text>
    <text x="38" y="210" font-size="11.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">maxComputeWorkgroupSizeX   256</text>
    <text x="38" y="228" font-size="11.5" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">features                    12</text>
    <rect x="386" y="158" width="148" height="24" rx="12" fill="url(#gpu31)"/>
    <text x="460" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b1220">建议 WebGPU</text>
    <text x="38" y="252" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">WebGPU / WebGL2 · same scene</text>

    <rect x="24" y="280" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="280" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="302" font-size="13.5" fill="#e2e8f0">不支持的机器继续 WebGL2，画面一样能用。</text>
    <text x="40" y="322" font-size="13.5" fill="#94a3b8">探测结果是建议，不是判决；回退路径要写完整。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#34d399" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#34d399"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：迁移三原则</text>

    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="90" width="226" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="112" font-size="15" fill="#0b1220">了解即可，</text>
    <text x="102" y="134" font-size="15" fill="#0b1220">不纳入考核。</text>

    <rect x="34" y="158" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="54" y="168" font-size="14" fill="#e2e8f0">新项目试水，旧项目保留回退</text>
    <rect x="34" y="184" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="54" y="194" font-size="14" fill="#e2e8f0">自定义 GLSL 材质单独评估</text>
    <rect x="34" y="210" width="10" height="10" rx="2" fill="#34d399"/>
    <text x="54" y="220" font-size="14" fill="#e2e8f0">先探测，再埋点，最后才热切换</text>

    <rect x="24" y="240" width="96" height="26" rx="13" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="72" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#fbbf24">⚠ 坑点</text>
    <text x="132" y="258" font-size="13" fill="#fbbf24">没探测就假设人人都有 WebGPU</text>
    <rect x="32" y="278" width="8" height="8" rx="2" fill="#fbbf24"/>
    <text x="52" y="287" font-size="13" fill="#94a3b8">缺 navigator.gpu 时直接白屏</text>
    <rect x="32" y="304" width="8" height="8" rx="2" fill="#fbbf24"/>
    <text x="52" y="313" font-size="13" fill="#94a3b8">把 forceWebGL 当成失败，埋点失真</text>

    <rect x="24" y="324" width="524" height="32" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="324" width="4" height="32" rx="2" fill="#34d399"/>
    <text x="40" y="346" font-size="13.5" fill="#e2e8f0">迁移成本可控：先让新后端跑起来，再谈重写。</text>
  </g>

  <text x="600" y="822" text-anchor="middle" font-size="12" fill="#64748b">EP.31 GPU 的第二张身份证 · 了解即可，不纳入阶段考核 · WebGPU 是选项，不是必修课</text>
</svg>
