<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.20</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">视觉回归：让机器玩找茬</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：凌晨的肉眼回归</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="242" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">改版要回归 20 个页面，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">我肉眼对到了凌晨两点！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="178" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">// 改版回归清单 · 第 23 次</text>
    <text x="38" y="200" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">[x] 首页  [x] 楼群页  [ ] 标注页</text>
    <text x="38" y="222" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">[ ] 特效页  [ ] 大屏页  … 共 20 页</text>
    <text x="38" y="244" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 凌晨 02:00，眼睛看花，漏掉 1 处</text>
    <text x="38" y="259" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 阴影偏移 2px，上线后被用户截图投诉</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">肉眼回归又慢又不可靠；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">漏掉一个阴影偏移，用户替你发现。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：让机器玩找茬</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="232" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">基线截图加像素对比，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">机器半分钟找完所有茬。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="36" y="168" width="150" height="74" rx="8" fill="#111a30" stroke="#475569"/>
    <text x="111" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2e8f0">基线截图</text>
    <text x="111" y="216" text-anchor="middle" font-size="11" fill="#94a3b8">baseline.png</text>
    <text x="111" y="233" text-anchor="middle" font-size="10.5" fill="#94a3b8">随仓库提交</text>
    <rect x="206" y="168" width="150" height="74" rx="8" fill="#111a30" stroke="#475569"/>
    <text x="281" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#e2e8f0">本次截图</text>
    <text x="281" y="216" text-anchor="middle" font-size="11" fill="#94a3b8">actual.png</text>
    <text x="281" y="233" text-anchor="middle" font-size="10.5" fill="#94a3b8">CI 现场拍摄</text>
    <path d="M360,205 L372,205" stroke="#a78bfa" stroke-width="2"/>
    <polygon points="372,200 382,205 372,210" fill="#a78bfa"/>
    <rect x="386" y="168" width="150" height="74" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.8"/>
    <text x="461" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f472b6">diff 图</text>
    <circle cx="428" cy="220" r="3.5" fill="#f472b6"/>
    <circle cx="452" cy="226" r="3.5" fill="#f472b6"/>
    <circle cx="478" cy="216" r="3.5" fill="#f472b6"/>
    <text x="461" y="238" text-anchor="middle" font-size="10.5" fill="#94a3b8">差异像素染红</text>
    <text x="36" y="257" font-size="12" fill="#cbd5e1" font-family="'SF Mono',Consolas,monospace">toHaveScreenshot · maxDiffPixelRatio 0.01</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">先固定种子、冻结动画再截图；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">差异超阈值就红灯，噪声区域用 mask 盖掉。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：CI 挡住阴影偏移</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="232" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">CI 秒出 diff 图，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">红块正好圈在阴影上！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="178" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">✗ 视觉门禁：默认视角与基线一致</text>
    <text x="38" y="200" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  2341 pixels (ratio 0.02) differ</text>
    <text x="38" y="222" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  Diff: campus-default-diff.png</text>
    <text x="38" y="244" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">✓ 结构门禁  ✓ 性能门禁 (9.6s)</text>
    <text x="38" y="259" font-size="12" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 阴影偏移 2px 也没混过去</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">artifact 自动上传三张图：基线/实拍/diff；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">review 看 diff 十秒定位，不用拉代码复现。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：门禁可信才管用</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="224" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">门禁不是让人怕，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">是让人信。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">种子不固定，基线永远对不上</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">基线在 Mac 生成，Linux CI 全挂</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">虚机帧时间硬卡 33ms，误伤一片</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">预算写进断言、截图交给机器——门禁可信，睡眠才稳。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.20</text>
</svg>
