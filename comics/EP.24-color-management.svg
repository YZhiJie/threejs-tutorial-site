    <text x="365" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">色调映射</text>
    <text x="365" y="220" text-anchor="middle" font-size="10" fill="#c4b5fd" font-family="'SF Mono',Consolas,monospace">ACES / AgX</text>
    <polygon points="422,205 434,205 434,200 444,208 434,216 434,211 422,211" fill="#94a3b8"/>
    <rect x="450" y="174" width="86" height="62" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="493" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">输出编码</text>
    <text x="493" y="220" text-anchor="middle" font-size="10" fill="#f9a8d4" font-family="'SF Mono',Consolas,monospace">linear → sRGB</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">颜色贴图设 SRGBColorSpace，数据贴图保持线性；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">输出前再做一次 sRGB 编码，中间全部在线性空间。</text>
  </g>

