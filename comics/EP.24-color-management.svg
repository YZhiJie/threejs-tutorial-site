    <text x="227" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">线性计算</text>
    <text x="227" y="220" text-anchor="middle" font-size="10" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">lighting / mix</text>
