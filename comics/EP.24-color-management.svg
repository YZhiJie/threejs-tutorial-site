    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">左边错误链路整块发灰，右边正确链路与设计值对齐；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">逐格读取屏幕十六进制，比「我觉得」可靠得多。</text>
