    <text x="62" y="246" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">design: #D67E2C</text>
    <rect x="258" y="234" width="16" height="16" rx="3" fill="#C9772F"/>
    <text x="282" y="246" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">screen: #C9772F</text>
    <text x="38" y="268" font-size="11.5" fill="#94a3b8">同一个十六进制，过了错误链路就会换一张脸</text>

