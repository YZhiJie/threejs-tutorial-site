<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.02</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">场景图与层级矩阵</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：月亮私奔了</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="244" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">月亮绕地球、地球绕太阳，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">一运行月亮就私奔了！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">moon.position.x = Math.cos(t) * 15</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">moon.position.z = Math.sin(t) * 15</text>
    <text x="38" y="214" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 手算世界坐标做圆周</text>
    <text x="38" y="234" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 地球一旦公转，月亮立刻错位</text>
    <text x="38" y="252" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// 层级关系全靠人肉维护</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">用世界坐标手算轨道，父节点一动，所有</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">三角函数都得重算——这正是场景图要解决的。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：场景图是一棵树</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="244" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">子节点的坐标，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">永远相对父节点计算。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="36" y="172" width="72" height="46" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="72" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#34d399">Scene</text>
    <text x="72" y="208" text-anchor="middle" font-size="10.5" fill="#94a3b8">树根</text>
    <polygon points="110,195 118,195 118,191 126,195 118,199 118,195" fill="#94a3b8"/>
    <rect x="128" y="172" width="72" height="46" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="164" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#22d3ee">solar</text>
    <text x="164" y="208" text-anchor="middle" font-size="10.5" fill="#94a3b8">空 Group</text>
    <polygon points="202,195 210,195 210,191 218,195 210,199 210,195" fill="#94a3b8"/>
    <rect x="220" y="172" width="80" height="46" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.8"/>
    <text x="260" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#fbbf24">earthOrbit</text>
    <text x="260" y="208" text-anchor="middle" font-size="10.5" fill="#94a3b8">公转节点</text>
    <polygon points="302,195 310,195 310,191 318,195 310,199 310,195" fill="#94a3b8"/>
    <rect x="320" y="172" width="72" height="46" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="356" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">earth</text>
    <text x="356" y="208" text-anchor="middle" font-size="10.5" fill="#94a3b8">自转 Mesh</text>
    <polygon points="394,195 402,195 402,191 410,195 402,199 402,195" fill="#94a3b8"/>
    <rect x="412" y="172" width="80" height="46" rx="8" fill="#111a30" stroke="#fbbf24" stroke-opacity="0.8"/>
    <text x="452" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#fbbf24">moonOrbit</text>
    <text x="452" y="208" text-anchor="middle" font-size="10.5" fill="#94a3b8">月球轨道</text>
    <polygon points="494,195 502,195 502,191 510,195 502,199 502,195" fill="#94a3b8"/>
    <rect x="452" y="224" width="0" height="0"/>
    <text x="500" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#cbd5e1">moon</text>
    <text x="36" y="244" font-size="12.5" fill="#e2e8f0">空 Group 当轨道节点，Mesh 只管自转造型</text>
    <text x="36" y="258" font-size="12" fill="#94a3b8" font-family="'SF Mono',Consolas,monospace">getWorldPosition() 沿父链累乘矩阵</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">旋转父节点，整棵子树跟着转；地球的位置</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">只写一次局部偏移，公转由父节点代劳。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：三层嵌套太阳系</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="244" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">原来公转自转，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">各转各的节点就行！</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">const dt = timer.getDelta()</text>
    <text x="38" y="196" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">earthOrbit.rotation.y += dt * 0.2</text>
    <text x="38" y="216" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">earth.rotation.y += dt * 1.0</text>
    <text x="38" y="236" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">moonOrbit.rotation.y += dt * 2.0</text>
    <text x="38" y="254" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 旋转的全是空 Group，位置从不改</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">太阳是 emissive 自发光，不会照亮行星，要</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">另放 PointLight；Fog 雾色必须与背景一致。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：动父则子随</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="232" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">层级的秘密六个字：</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">动父，则子随。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">position 不动：查 add、查是否每帧被覆盖</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">traverse 会遍历灯和相机，用 isMesh 过滤</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">上千个静态物体，才值得关 matrixAutoUpdate</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">动父则子随，是场景组织的第一原则。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.02</text>
</svg>
