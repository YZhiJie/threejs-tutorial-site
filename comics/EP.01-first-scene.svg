<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.01</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">第一个三维场景</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：屏幕一片黑</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="244" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">教程抄完一运行，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">屏幕怎么一片黑？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 标签君的首份代码</text>
    <text x="38" y="194" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const mesh = new THREE.Mesh(geo, mat)</text>
    <text x="38" y="214" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// scene.add(mesh)？忘接了</text>
    <text x="38" y="234" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">camera.position.z = 0</text>
    <text x="38" y="252" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">// 相机还钻进了盒子里</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">黑屏三查：有没有 add、受光材质有没有灯、</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">相机是不是站在了物体肚子里。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：四个角色一台戏</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="244" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">舞台、眼睛、画笔，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">再加一个演员，齐了。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="36" y="176" width="96" height="52" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="84" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#22d3ee">Scene</text>
    <text x="84" y="217" text-anchor="middle" font-size="11.5" fill="#94a3b8">舞台 + Mesh</text>
    <polygon points="136,202 148,202 148,197 158,202 148,207 148,202" fill="#94a3b8"/>
    <rect x="160" y="176" width="96" height="52" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="208" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a78bfa">Camera</text>
    <text x="208" y="217" text-anchor="middle" font-size="11.5" fill="#94a3b8">眼睛</text>
    <polygon points="260,202 272,202 272,197 282,202 272,207 272,202" fill="#94a3b8"/>
    <rect x="284" y="176" width="104" height="52" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.7"/>
    <text x="336" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#f472b6">Renderer</text>
    <text x="336" y="217" text-anchor="middle" font-size="11.5" fill="#94a3b8">画笔</text>
    <polygon points="392,202 404,202 404,197 414,202 404,207 404,202" fill="#94a3b8"/>
    <rect x="416" y="176" width="84" height="52" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="458" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#34d399">Canvas</text>
    <text x="458" y="217" text-anchor="middle" font-size="11.5" fill="#94a3b8">画面</text>
    <text x="36" y="252" font-size="12.5" fill="#e2e8f0" font-family="'SF Mono',Consolas,monospace">Mesh = Geometry（造型）+ Material（戏服）</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">每一帧：相机对着场景拍一张，渲染器画到</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">canvas；四件套起来就是最小 3D 管线。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：没灯的球是黑球</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="224" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">换成 Standard 材质，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">球怎么就黑了？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="36" y="172" font-size="12.5" fill="#f472b6">❌ 受光材质 + 零灯光</text>
    <rect x="36" y="178" width="216" height="72" rx="8" fill="#050810" stroke="#475569"/>
    <text x="144" y="220" text-anchor="middle" font-size="14" fill="#475569">（一片漆黑）</text>
    <text x="276" y="172" font-size="12.5" fill="#34d399">✅ 加灯 / 用 Normal 材质</text>
    <rect x="276" y="178" width="216" height="72" rx="8" fill="#0b1424" stroke="#22d3ee" stroke-opacity="0.5"/>
    <polygon points="388,190 416,204 388,218 360,204" fill="#67e8f9" opacity="0.85"/>
    <polygon points="360,204 388,218 388,244 360,230" fill="#0891b2"/>
    <polygon points="388,218 416,204 416,230 388,244" fill="#0e7490"/>
    <text x="36" y="257" font-size="12.5" fill="#e2e8f0" font-family="'SF Mono',Consolas,monospace">最小套餐：Ambient + Directional</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">MeshBasic/NormalMaterial 不吃光；Standard 等</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">PBR 材质必须有光或环境贴图才显形。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：先转起来再好看</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="232" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">先让立方体转起来，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">再慢慢调画面效果。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">near 不能设 0，far 也别拉到无限大</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">改 fov/aspect 后须 updateProjectionMatrix</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">importmap 必须写在 module 脚本之前</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">最小管线先跑通，再按角色逐个加效果。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.01</text>
</svg>
