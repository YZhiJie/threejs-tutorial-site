    <text x="38" y="200" font-size="12.5" fill="#c4b5fd" font-family="'SF Mono',Consolas,monospace">const fs = "uniform float uTime; ..."</text>
    <text x="38" y="226" font-size="12.5" fill="#94a3b8">改了一处，另一处忘同步</text>
