<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.00</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">学前必备：开跑前的检查清单</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：双击就报错</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="244" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">官网示例存成 html，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">双击打开就白屏报错？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#64748b" font-family="'SF Mono',Consolas,monospace">// 双击 file:// 打开 hello-cube.html</text>
    <text x="38" y="196" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">Access to script from origin 'null' has</text>
    <text x="38" y="218" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">been blocked by CORS policy</text>
    <text x="38" y="244" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">npx serve . → http://localhost:3000</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">浏览器把 file:// 当跨源对待：ES Module</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">与 importmap 必须跑在 http(s) 服务上。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：两条硬门槛</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="252" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">先备两件套：会读 ES Module，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">会起一个本地静态服务器。</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="36" y="170" width="160" height="60" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text x="116" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#22d3ee">ES Module</text>
    <text x="116" y="214" text-anchor="middle" font-size="11" fill="#94a3b8">import / async</text>
    <rect x="208" y="170" width="160" height="60" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.7"/>
    <text x="288" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#a78bfa">http 服务</text>
    <text x="288" y="214" text-anchor="middle" font-size="11" fill="#94a3b8">serve · Live Server</text>
    <rect x="380" y="170" width="160" height="60" rx="8" fill="#111a30" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="460" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#34d399">importmap</text>
    <text x="460" y="214" text-anchor="middle" font-size="11" fill="#94a3b8">浏览器路径别名</text>
    <text x="36" y="250" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">&lt;script type="importmap"&gt; { "three": "…" }</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">硬性门槛只有两条：读得懂 ES Module 的</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">JS，和会起一个本地静态服务器，其余边学边补。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：向量的两把尺</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="224" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">3D 数学要啃完一门课，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">还是几个直觉就够？</text>
    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <rect x="36" y="174" width="216" height="66" rx="8" fill="#050810" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="144" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#7dd3fc">A·B 点积 · 判夹角</text>
    <text x="144" y="212" text-anchor="middle" font-size="12" fill="#e2e8f0">&gt;0 同向 · =0 垂直</text>
    <text x="144" y="230" text-anchor="middle" font-size="12" fill="#94a3b8">&lt;0 反向 · 即 cosθ</text>
    <rect x="276" y="174" width="216" height="66" rx="8" fill="#050810" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="384" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#fbbf24">A×B 叉积 · 求法线</text>
    <text x="384" y="212" text-anchor="middle" font-size="12" fill="#e2e8f0">C 同时垂直于 A、B</text>
    <text x="384" y="230" text-anchor="middle" font-size="12" fill="#94a3b8">模长 = 平行四边形面积</text>
    <text x="36" y="254" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">180° = π rad · Three.js 角度全用弧度</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">点积判朝向夹角，叉积给法线与面积；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">弧度与右手系是行话，先混个脸熟就够。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三角形拼出世界</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="252" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">最后三个常识：三角形拼一切、</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">管线三步，PBR 要开灯。</text>
    <rect x="36" y="152" width="64" height="20" rx="10" fill="#f97316"/>
    <text x="68" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="110" y="167" font-size="12.5" fill="#e2e8f0">角度全是弧度：180° = Math.PI</text>
    <rect x="36" y="176" width="64" height="20" rx="10" fill="#f97316"/>
    <text x="68" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="110" y="191" font-size="12.5" fill="#e2e8f0">new 出的 Mesh 忘 scene.add 必黑屏</text>
    <rect x="36" y="200" width="64" height="20" rx="10" fill="#f97316"/>
    <text x="68" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <text x="110" y="215" font-size="12.5" fill="#e2e8f0">PBR 材质没灯 = 纯黑一片</text>
    <rect x="24" y="232" width="524" height="30" rx="8" fill="#0a0f1c" stroke="#f97316" stroke-opacity="0.35"/>
    <text x="38" y="251" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">顶点着色 → 光栅化 → 片元着色 → 像素上屏</text>
    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f97316"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">先把清单过一遍再上路：JS 过关、服务起好、</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">向量有直觉，再去开 EP.01 的第一课。</text>
  </g>

  <text x="1180" y="826" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.00</text>
</svg>
