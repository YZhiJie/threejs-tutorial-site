      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="228" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">生成器是纯函数：</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">参数进，几何出。</text>

    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="36" y="174" width="106" height="62" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="89" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">地块划分</text>
    <text x="89" y="220" text-anchor="middle" font-size="10" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">jitter(grid)</text>
    <polygon points="146,205 158,205 158,200 168,208 158,216 158,211 146,211" fill="#94a3b8"/>
    <rect x="174" y="174" width="106" height="62" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="227" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">建筑体块</text>
    <text x="227" y="220" text-anchor="middle" font-size="10" fill="#c4b5fd" font-family="'SF Mono',Consolas,monospace">box + roof</text>
    <polygon points="284,205 296,205 296,200 306,208 296,216 296,211 284,211" fill="#94a3b8"/>
    <rect x="312" y="174" width="106" height="62" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="365" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">街道绿化</text>
    <text x="365" y="220" text-anchor="middle" font-size="10" fill="#f9a8d4" font-family="'SF Mono',Consolas,monospace">merge + inst</text>
    <polygon points="422,205 434,205 434,200 444,208 434,216 434,211 422,211" fill="#94a3b8"/>
    <rect x="450" y="174" width="86" height="62" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.6"/>
    <text x="493" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">合并实例</text>
    <text x="493" y="220" text-anchor="middle" font-size="10" fill="#fdba74" font-family="'SF Mono',Consolas,monospace">few calls</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">数据先行：地块 / 楼块 / 窗格都只是数组；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">渲染层再决定合并、实例化还是逐 Mesh。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：300 calls 降到 9</text>

    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="248" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">同一个 seed，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">刷新十次都是同一座城。</text>

    <rect x="24" y="152" width="524" height="110" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <rect x="36" y="168" width="236" height="80" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.55"/>
    <text x="154" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#fdba74">每楼一 Mesh</text>
    <text x="154" y="218" text-anchor="middle" font-size="11.5" fill="#f8fafc" font-family="'SF Mono',Consolas,monospace">draw calls = 300</text>
    <text x="154" y="238" text-anchor="middle" font-size="10.5" fill="#94a3b8">结构直观，提交爆炸</text>
    <rect x="286" y="168" width="236" height="80" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="404" y="194" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7dd3fc">实例 + 合并</text>
    <text x="404" y="218" text-anchor="middle" font-size="11.5" fill="#f8fafc" font-family="'SF Mono',Consolas,monospace">draw calls = 9</text>
    <text x="404" y="238" text-anchor="middle" font-size="10.5" fill="#94a3b8">几何不变，提交变少</text>
    <text x="36" y="256" font-size="10.5" fill="#64748b">三角形数几乎相同，差别全在 CPU 的提交次数</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">几何量没变，变的只是「怎么提交」；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">先砍 draw call，再谈三角数。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：种子 + 参数 + 预算</text>

    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="222" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">参数定版，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">城市才能复现。</text>

    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="198" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="207" font-size="14" fill="#e2e8f0">Math.random 生成——刷新就换城</text>
    <rect x="32" y="226" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="235" font-size="14" fill="#e2e8f0">窗格不设预算——五万栋直接卡死</text>
    <rect x="32" y="254" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="263" font-size="14" fill="#e2e8f0">每楼一 Mesh——calls 随楼数上涨</text>

    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">种子管复现，参数管风格，预算管性能。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.29</text>
</svg>
