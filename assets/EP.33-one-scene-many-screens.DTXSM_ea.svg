    <text x="102" y="126" font-size="15" fill="#0b1220">多个运行时适配器。</text>

    <rect x="24" y="154" width="80" height="26" rx="13" fill="#f97316"/>
    <text x="64" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">三个坑</text>
