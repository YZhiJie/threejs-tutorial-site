  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad33)">一景多屏：一份场景，三种运行环境</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad33)" opacity="0.6"/>

  <g transform="translate(20,84)">
