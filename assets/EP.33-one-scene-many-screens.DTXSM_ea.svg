    <rect x="88" y="82" width="286" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">没有 DOM？先给 three</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">补一个最小可用的宿主。</text>

    <rect x="24" y="152" width="116" height="62" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="82" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">canvas shim</text>
    <text x="82" y="197" text-anchor="middle" font-size="10" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">createCanvas</text>

    <rect x="152" y="152" width="116" height="62" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="210" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">WebGL ctx</text>
    <text x="210" y="197" text-anchor="middle" font-size="10" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">getContext</text>

    <rect x="280" y="152" width="116" height="62" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="338" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">ImageLoader</text>
    <text x="338" y="197" text-anchor="middle" font-size="10" fill="#c4b5fd" font-family="'SF Mono',Consolas,monospace">createImage</text>

    <rect x="408" y="152" width="116" height="62" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="466" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#e2e8f0">rAF / touch</text>
    <text x="466" y="197" text-anchor="middle" font-size="10" fill="#f9a8d4" font-family="'SF Mono',Consolas,monospace">shim / map</text>

    <rect x="24" y="226" width="524" height="52" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="248" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">new WebGLRenderer({ canvas, context: gl })</text>
    <text x="38" y="268" font-size="11.5" fill="#94a3b8">同一个渲染器，换掉它脚下的宿主</text>

    <rect x="24" y="290" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="52" rx="2" fill="#a78bfa"/>
