    <text x="262" y="236" font-size="11.5" fill="#e2e8f0">20MB</text>
    <text x="404" y="236" font-size="11.5" fill="#e2e8f0">4MB</text>

    <text x="40" y="256" font-size="11.5" fill="#94a3b8">切后台</text>
    <text x="152" y="256" font-size="11.5" fill="#e2e8f0">visibility</text>
    <text x="262" y="256" font-size="11.5" fill="#e2e8f0">onHide</text>
    <text x="404" y="256" font-size="11.5" fill="#e2e8f0">onHide</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="300" font-size="13.5" fill="#e2e8f0">降级不是随手写 if，而是让能力清单决定加载什么；</text>
    <text x="40" y="320" font-size="13.5" fill="#94a3b8">同一份场景描述，按端裁规格、裁特性。</text>
