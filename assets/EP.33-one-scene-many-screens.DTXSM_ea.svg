    <text x="52" y="209" font-size="14" fill="#e2e8f0">平台判断散落在业务代码里</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">纹理规格写死，小游戏必爆</text>
