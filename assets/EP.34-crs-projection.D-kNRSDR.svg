<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg34" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
    <linearGradient id="titleGrad34" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ok34" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="warn34" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg34)"/>
  <polygon points="990,0 1070,0 770,840 690,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.34</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad34)">坐标系、投影与一条不能错的链</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad34)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：楼和底图差了 200 米</text>

    <rect x="24" y="46" width="524" height="152" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <g stroke="#1b2947" stroke-width="1">
      <line x1="76" y1="50" x2="76" y2="194"/>
      <line x1="128" y1="50" x2="128" y2="194"/>
      <line x1="180" y1="50" x2="180" y2="194"/>
      <line x1="284" y1="50" x2="284" y2="194"/>
      <line x1="336" y1="50" x2="336" y2="194"/>
      <line x1="388" y1="50" x2="388" y2="194"/>
      <line x1="440" y1="50" x2="440" y2="194"/>
      <line x1="492" y1="50" x2="492" y2="194"/>
      <line x1="28" y1="90" x2="544" y2="90"/>
      <line x1="28" y1="126" x2="544" y2="126"/>
      <line x1="28" y1="162" x2="544" y2="162"/>
    </g>
    <line x1="24" y1="130" x2="548" y2="130" stroke="#2d466d" stroke-width="6"/>
    <text x="34" y="64" font-size="10.5" fill="#64748b">WGS84 底图</text>

    <rect x="286" y="92" width="54" height="54" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="313" y="86" text-anchor="middle" font-size="10.5" fill="#7dd3fc">底图位置</text>
    <rect x="344" y="98" width="54" height="54" fill="#f97316" opacity="0.82" stroke="#fdba74" stroke-width="1.4"/>
    <text x="371" y="168" text-anchor="middle" font-size="10.5" fill="#fdba74">模型位置</text>

    <path d="M311 176 L368 176" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4"/>
    <polygon points="368,176 361,172 361,180" fill="#fbbf24"/>
    <text x="339" y="190" text-anchor="middle" font-size="11" fill="#fbbf24">≈ 200 m</text>

    <g transform="translate(52,318)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="96,232 80,238 96,244" fill="#f8fafc"/>
    <rect x="96" y="216" width="306" height="60" rx="10" fill="#f8fafc"/>
    <text x="110" y="240" font-size="14" fill="#0b1220">楼建好了，底图也对，</text>
    <text x="110" y="262" font-size="14" fill="#0b1220">为什么整体偏了 200 米？</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三套坐标，不能混用</text>

    <g transform="translate(52,104)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,92 74,98 88,104" fill="#f8fafc"/>
    <rect x="88" y="76" width="330" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="98" font-size="15" fill="#0b1220">同一块地，可能有三套数值；</text>
    <text x="102" y="120" font-size="15" fill="#0b1220">叠错一套，整城平移几百米。</text>

    <rect x="24" y="146" width="160" height="92" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="104" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#22d3ee">WGS84</text>
    <text x="104" y="196" text-anchor="middle" font-size="11.5" fill="#e2e8f0">GPS 原始</text>
    <text x="104" y="216" text-anchor="middle" font-size="11.5" fill="#94a3b8">真实经纬度</text>

    <rect x="196" y="146" width="160" height="92" rx="8" fill="#111a30" stroke="#f97316" stroke-opacity="0.6"/>
    <text x="276" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#f97316">GCJ-02</text>
    <text x="276" y="196" text-anchor="middle" font-size="11.5" fill="#e2e8f0">高德 / 腾讯底图</text>
    <text x="276" y="216" text-anchor="middle" font-size="11.5" fill="#94a3b8">国测局偏移</text>

    <rect x="368" y="146" width="160" height="92" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="448" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#a78bfa">BD-09</text>
    <text x="448" y="196" text-anchor="middle" font-size="11.5" fill="#e2e8f0">百度地图</text>
    <text x="448" y="216" text-anchor="middle" font-size="11.5" fill="#94a3b8">在 GCJ-02 上再偏</text>

    <rect x="24" y="252" width="524" height="88" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="276" font-size="13" fill="#e2e8f0">偏移量随城市变化，不能用统一常数修补。</text>
    <text x="38" y="300" font-size="13" fill="#94a3b8">转换只在 ETL 做一次，源坐标系写进元数据。</text>
    <text x="38" y="324" font-size="12" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">sourceCrs -&gt; WGS84 -&gt; ENU</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">投影：从球面压到米制平面</text>

    <rect x="24" y="46" width="524" height="132" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="72" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">x = R * λ * π/180</text>
    <text x="38" y="96" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">y = R * ln(tan(π/4 + φ/2))</text>
    <text x="38" y="120" font-size="12.5" fill="#c4b5fd" font-family="'SF Mono',Consolas,monospace">east = (λ-λ0) * R * cos(φ0) * π/180</text>
    <text x="38" y="144" font-size="12.5" fill="#c4b5fd" font-family="'SF Mono',Consolas,monospace">north = (φ-φ0) * R * π/180</text>
    <text x="38" y="166" font-size="11" fill="#94a3b8">Web Mercator EPSG:3857 / 局部 ENU</text>

    <rect x="24" y="190" width="524" height="42" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="190" width="4" height="42" rx="2" fill="#22d3ee"/>
    <text x="40" y="216" font-size="13.5" fill="#e2e8f0">3857 是切片用的公共平面，不是测量平面。</text>

    <g transform="translate(52,308)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="96,252 80,258 96,264" fill="#f8fafc"/>
    <rect x="96" y="236" width="286" height="52" rx="10" fill="#f8fafc"/>
    <text x="110" y="258" font-size="14" fill="#0b1220">先投影，再建几何。</text>
    <text x="110" y="280" font-size="14" fill="#0b1220">渲染循环里不转坐标。</text>

    <rect x="398" y="240" width="150" height="96" rx="8" fill="#0a0f1c" stroke="#223055"/>
    <line x1="418" y1="316" x2="532" y2="316" stroke="#22d3ee" stroke-width="1.5"/>
    <polygon points="532,316 524,312 524,320" fill="#22d3ee"/>
    <line x1="418" y1="316" x2="418" y2="258" stroke="#a78bfa" stroke-width="1.5"/>
    <polygon points="418,258 414,266 422,266" fill="#a78bfa"/>
    <circle cx="418" cy="316" r="3.2" fill="#fbbf24"/>
    <text x="536" y="320" font-size="10.5" fill="#22d3ee">E</text>
    <text x="410" y="254" font-size="10.5" fill="#a78bfa">N</text>
    <text x="404" y="332" font-size="9.5" fill="#fbbf24">0</text>
    <text x="473" y="332" text-anchor="middle" font-size="10" fill="#94a3b8">1 单位 = 1 米</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：坐标链的三条纪律</text>

    <g transform="translate(52,100)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,88 74,94 88,100" fill="#f8fafc"/>
    <rect x="88" y="72" width="336" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="94" font-size="15" fill="#0b1220">纠偏进 ETL，渲染层只认 ENU。</text>
    <text x="102" y="116" font-size="15" fill="#0b1220">坐标转换，全链路只做一次。</text>

    <rect x="24" y="144" width="524" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="144" width="4" height="40" rx="2" fill="#22d3ee"/>
    <text x="40" y="169" font-size="13.5" fill="#e2e8f0">① 源坐标系 → WGS84 → ENU，只转一次</text>

    <rect x="24" y="192" width="524" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="192" width="4" height="40" rx="2" fill="#a78bfa"/>
    <text x="40" y="217" font-size="13.5" fill="#e2e8f0">② 原点写进配置，数据保留经纬度双字段</text>

    <rect x="24" y="240" width="524" height="40" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="240" width="4" height="40" rx="2" fill="#f97316"/>
    <text x="40" y="265" font-size="13.5" fill="#e2e8f0">③ 大坐标做浮动原点，远端才不抖</text>

    <g transform="translate(52,322)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#0ea5e9"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#1e40af"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
      <rect x="9" y="16" width="13" height="17" rx="3" fill="#e2e8f0"/>
      <text x="17" y="28" text-anchor="middle" font-size="6.5" fill="#0b1220">GIS</text>
    </g>
    <polygon points="110,306 94,312 110,318" fill="#f8fafc"/>
    <rect x="110" y="292" width="366" height="42" rx="10" fill="#f8fafc"/>
    <text x="124" y="318" font-size="13" fill="#0b1220">交付前用控制点验收，别靠肉眼判断。</text>
  </g>
</svg>
