<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg38" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad38" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="good38" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bad38" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg38)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.38</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad38)">角色在想什么：输入映射与状态机</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Three.js 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad38)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：两个布尔同时在跑</text>

    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#f97316"/>
      <circle cx="15" cy="4" r="6.5" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,6 q3,-2 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,94 74,100 88,106" fill="#f8fafc"/>
    <rect x="88" y="76" width="320" height="70" rx="10" fill="#f8fafc"/>
    <text x="102" y="101" font-size="15" fill="#0b1220">我跳起来了，结果还能攻击？</text>
    <text x="102" y="125" font-size="15" fill="#0b1220">日志里两个状态同时在跑。</text>

    <rect x="24" y="160" width="524" height="94" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <rect x="40" y="176" width="86" height="28" rx="8" fill="#111a30" stroke="#223055"/>
    <text x="83" y="195" text-anchor="middle" font-size="12.5" fill="#94a3b8">idle</text>
    <rect x="148" y="176" width="86" height="28" rx="8" fill="#2a1430" stroke="#f472b6"/>
    <text x="191" y="195" text-anchor="middle" font-size="12.5" fill="#f9a8d4">jump</text>
    <rect x="256" y="176" width="86" height="28" rx="8" fill="#2a1430" stroke="#f472b6"/>
    <text x="299" y="195" text-anchor="middle" font-size="12.5" fill="#f9a8d4">attack</text>
    <text x="360" y="195" font-size="12" fill="#fb7185">两个都亮 = 非法</text>
    <text x="40" y="228" font-size="11.5" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" fill="#f87171">isJumping &amp;&amp; isAttacking</text>
    <text x="40" y="246" font-size="11.5" fill="#94a3b8">状态散成布尔，组合数量指数增长。</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="301" font-size="13.5" fill="#e2e8f0">没人说得清角色现在到底在做什么；</text>
    <text x="40" y="321" font-size="13.5" fill="#94a3b8">非法状态也没有统一的拒绝入口。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：三层输入映射</text>

    <g transform="translate(52,108)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,98 74,104 88,110" fill="#f8fafc"/>
    <rect x="88" y="80" width="306" height="64" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">先把按键翻译成语义动作，</text>
    <text x="102" y="128" font-size="15" fill="#0b1220">再让状态机决定能不能做。</text>

    <rect x="24" y="158" width="140" height="46" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="94" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">设备事件</text>
    <text x="94" y="197" text-anchor="middle" font-size="12" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" fill="#7dd3fc">KeyJ</text>
    <polygon points="172,174 186,181 172,188" fill="#64748b"/>
    <rect x="194" y="158" width="150" height="46" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="269" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">语义动作</text>
    <text x="269" y="197" text-anchor="middle" font-size="12" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" fill="#c4b5fd">attack</text>
    <polygon points="352,174 366,181 352,188" fill="#64748b"/>
    <rect x="374" y="158" width="174" height="46" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="461" y="178" text-anchor="middle" font-size="11" fill="#94a3b8">状态转移</text>
    <text x="461" y="197" text-anchor="middle" font-size="12" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" fill="#f9a8d4">attack -&gt; hurt</text>

    <rect x="24" y="216" width="524" height="50" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="238" font-size="11.5" font-family="'SF Mono','JetBrains Mono',Consolas,monospace" fill="#7dd3fc">KEY_TO_ACTION[event.code] -&gt; 'attack'</text>
    <text x="38" y="256" font-size="11.5" fill="#94a3b8">只有转移表允许，才真正进入 attack 状态。</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="301" font-size="13.5" fill="#e2e8f0">设备层只写语义动作，状态机只认事件；</text>
    <text x="40" y="321" font-size="13.5" fill="#94a3b8">换键盘、加手柄、加屏幕按钮都不动规则。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#fbbf24" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#fbbf24"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：列出合法出口</text>

    <g transform="translate(52,104)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-13,-19 L-8,-5 L-3,-22 L2,-5 L8,-19 L12,-5 L16,-2 Q0,-12 -16,-2 Z" fill="#334155"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-4,6 q4,3 8,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,94 74,100 88,106" fill="#f8fafc"/>
    <rect x="88" y="76" width="276" height="64" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">这张表就是唯一事实来源。</text>
    <text x="102" y="124" font-size="15" fill="#0b1220">查不到出口，就拒绝。</text>

    <rect x="24" y="150" width="524" height="116" rx="8" fill="#0a0f1c" stroke="#fbbf24" stroke-opacity="0.35"/>
    <rect x="24" y="150" width="524" height="26" rx="8" fill="#111a30"/>
    <text x="40" y="168" font-size="12" font-weight="bold" fill="#7dd3fc">状态</text>
    <text x="120" y="168" font-size="12" font-weight="bold" fill="#34d399">可接收事件</text>
    <text x="360" y="168" font-size="12" font-weight="bold" fill="#fbbf24">去向</text>
    <line x1="36" y1="176" x2="536" y2="176" stroke="#1e2a44"/>
    <text x="40" y="194" font-size="11.5" fill="#e2e8f0">idle</text>
    <text x="120" y="194" font-size="11.5" fill="#94a3b8">move · jump · attack · hurt</text>
    <text x="360" y="194" font-size="11.5" fill="#e2e8f0">对应状态</text>
    <text x="40" y="216" font-size="11.5" fill="#e2e8f0">move</text>
    <text x="120" y="216" font-size="11.5" fill="#94a3b8">stop · jump · attack · hurt</text>
    <text x="360" y="216" font-size="11.5" fill="#e2e8f0">idle / jump / attack</text>
    <text x="40" y="238" font-size="11.5" fill="#e2e8f0">jump</text>
    <text x="120" y="238" font-size="11.5" fill="#94a3b8">land · hurt</text>
    <text x="360" y="238" font-size="11.5" fill="#e2e8f0">idle 或 move / hurt</text>
    <text x="40" y="260" font-size="11.5" fill="#e2e8f0">attack</text>
    <text x="120" y="260" font-size="11.5" fill="#94a3b8">done · hurt</text>
    <text x="360" y="260" font-size="11.5" fill="#e2e8f0">idle 或 move / hurt</text>

    <rect x="24" y="278" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="278" width="4" height="52" rx="2" fill="#fbbf24"/>
    <text x="40" y="301" font-size="13.5" fill="#e2e8f0">自动转移也走同一个入口，日志才完整；</text>
    <text x="40" y="321" font-size="13.5" fill="#94a3b8">查表失败就拒绝，并记录原因与时间戳。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：三条纪律</text>

    <g transform="translate(52,104)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,94 74,100 88,106" fill="#f8fafc"/>
    <rect x="88" y="76" width="300" height="64" rx="10" fill="#f8fafc"/>
    <text x="102" y="100" font-size="15" fill="#0b1220">状态收敛成一个变量，</text>
    <text x="102" y="124" font-size="15" fill="#0b1220">规则收敛到一张表。</text>

    <rect x="24" y="152" width="80" height="26" rx="13" fill="#f97316"/>
    <text x="64" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">三个坑</text>
    <rect x="32" y="196" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="205" font-size="14" fill="#e2e8f0">状态与布尔值混用，组合失控</text>
    <rect x="32" y="224" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="233" font-size="14" fill="#e2e8f0">落地、攻击结束绕过统一入口</text>
    <rect x="32" y="252" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="261" font-size="14" fill="#e2e8f0">用帧数计时，时长随刷新率漂移</text>

    <rect x="24" y="282" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="282" width="4" height="50" rx="2" fill="#22d3ee"/>
    <text x="40" y="304" font-size="13.5" font-weight="bold" fill="#22d3ee">码叔总结</text>
    <text x="40" y="324" font-size="13.5" fill="#e2e8f0">同一时刻只有一个状态，所有转移都查表。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · threejs-tutorial · EP.38</text>
</svg>
