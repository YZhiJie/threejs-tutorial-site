<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>telemetry-pipeline · 容错分级与遥测管道</title>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    .info {
      position: fixed;
      top: 14px;
      left: 14px;
      max-width: 360px;
      padding: 12px 14px;
      background: rgba(11, 14, 20, .74);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.65;
      pointer-events: none;
    }

    .info b { color: #7cc4ff; }
    .info .mono {
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 11.5px;
      color: #94a3b8;
    }

    /* 右侧遥测浮层 */
    .panel {
      position: fixed;
      right: 14px;
      bottom: 58px;
      width: 330px;
      max-height: calc(100vh - 190px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 11px 12px;
      overflow-y: auto;
      background: rgba(13, 19, 30, .86);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 10px;
      font-size: 12px;
    }

    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, .28);
      border-radius: 3px;
    }

    .p-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .p-head b { color: #7cc4ff; }

    .badge {
      margin-left: auto;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      border: 1px solid rgba(52, 211, 153, .45);
      color: #34d399;
    }

    .badge.off {
      border-color: rgba(248, 113, 113, .45);
      color: #f87171;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .metric {
      padding: 6px 6px;
      border-radius: 7px;
      background: rgba(30, 41, 59, .55);
      border: 1px solid rgba(148, 163, 184, .14);
      text-align: center;
    }

    .metric span {
      display: block;
      font-size: 10px;
      color: #94a3b8;
    }

    .metric strong {
      display: block;
      margin-top: 2px;
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      color: #e2e8f0;
    }

    .metric strong.bad { color: #f87171; }
    .metric strong.warn { color: #fbbf24; }
    .metric strong.ok { color: #34d399; }

    #spark {
      width: 100%;
      height: 44px;
      border-radius: 6px;
      background: rgba(8, 12, 20, .8);
      border: 1px solid rgba(148, 163, 184, .12);
    }

    .ladder {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .chip {
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10.5px;
      color: #64748b;
      border: 1px solid rgba(148, 163, 184, .2);
      transition: .25s;
    }

    .chip.on {
      color: #0b1220;
      font-weight: 700;
      background: #fbbf24;
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(251, 191, 36, .35);
    }

    .ladder-name { font-size: 11px; color: #94a3b8; }

    .sub-row {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: #64748b;
    }

    .sub-row b { color: #cbd5e1; font-variant-numeric: tabular-nums; }

    .evlog {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 92px;
      overflow: hidden;
    }

    .evlog div {
      font-size: 10.5px;
      line-height: 1.45;
      color: #94a3b8;
      font-family: 'SF Mono', Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .evlog div.lv { color: #fbbf24; }
    .evlog div.up { color: #34d399; }

    #payload {
      margin: 0;
      padding: 7px 8px;
      max-height: 96px;
      overflow: auto;
      border-radius: 6px;
      background: #080c14;
      border: 1px solid rgba(148, 163, 184, .14);
      color: #7dd3fc;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(11, 14, 20, .72);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 静态兜底画面 */
    .poster {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4;
      background:
        radial-gradient(circle at 50% 40%, rgba(34, 211, 238, .14), transparent 55%),
        linear-gradient(160deg, #070b13, #0d1524 60%, #120c1e);
      pointer-events: none;
    }

    .poster.show { display: flex; }

    .poster .card {
      text-align: center;
      padding: 26px 34px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, .22);
      background: rgba(9, 13, 22, .82);
    }

    .poster .t {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f87171;
    }

    .poster .s {
      margin-top: 8px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.7;
    }

    .poster .pill {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, .4);
    }

    .lil-gui.root {
      --width: 248px;
      max-height: calc(100vh - 24px);
    }

    @media (max-width: 820px) {
      .info { max-width: 240px; font-size: 12px; }
      .panel { width: 250px; font-size: 11px; bottom: 54px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .lil-gui.root { --width: 190px; }
    }

    @media (max-width: 620px) {
      .panel { display: none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="app"></div>

  <div class="info">
    <b>telemetry-pipeline · 容错分级与遥测管道</b><br />
    打开「重负载」，观察帧时间变长后逐级降档；关掉后按迟滞规则逐级升回。<br />
    <span class="mono">所有上报均为 dry-run：只在控制台与右侧浮层显示 payload，不发任何网络请求。</span>
  </div>

  <div class="poster" id="poster">
    <div class="card">
      <div class="t">渲染已熔断 · 静态兜底</div>
      <div class="s">连续劣化触达 L6，自动降级到此为止<br />保留一张静态图，避免用户看到黑屏</div>
      <div class="pill">点右上角「重置画质」恢复渲染</div>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="p-head">
      <b>遥测管道</b>
      <span class="badge" id="sampleBadge">会话已采样</span>
    </div>

    <div class="metrics">
      <div class="metric"><span>FPS</span><strong id="mFps">--</strong></div>
      <div class="metric"><span>帧时间</span><strong id="mMs">--</strong></div>
      <div class="metric"><span>预算</span><strong>16.6</strong></div>
      <div class="metric"><span>待上报</span><strong id="mPending">0</strong></div>
    </div>

    <canvas id="spark" width="620" height="88"></canvas>

    <div class="ladder" id="ladder"></div>
    <div class="ladder-name" id="ladderName">L0 全画质</div>

    <div class="sub-row">
      <span>已上报批次 <b id="mSent">0</b></span>
      <span>未命中丢弃 <b id="mDrop">0</b></span>
      <span>事件类型 <b id="mTypes">0</b></span>
    </div>

    <div class="evlog" id="evlog"></div>
    <pre id="payload">等待首个聚合窗口（3 秒）…</pre>
  </aside>

  <div class="hint">右上角切「重负载」与采样率 · 拖拽旋转视角 · 滚轮缩放</div>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
    import GUI from 'three/addons/libs/lil-gui.module.min.js'

    /* ==================================================================
       ① 场景：一套可以逐层「拆掉」的画质栈
          DPR → 泛光 → 阴影 → 反射 → 粒子
    ================================================================== */
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.03)

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120)
    camera.position.set(0, 6, 14)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(innerWidth, innerHeight)
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap
    document.getElementById('app').appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.target.set(0, 1.6, 0)
    controls.minDistance = 5
    controls.maxDistance = 30

    // 环境反射：给地面一份真实的环境贴图
    const pmrem = new THREE.PMREMGenerator(renderer)
    const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
    scene.environment = envTex

    scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x101018, 0.75))
    const sun = new THREE.DirectionalLight(0xffffff, 2.4)
    sun.position.set(6, 12, 8)
    sun.castShadow = true
    sun.shadow.mapSize.set(2048, 2048)
    sun.shadow.camera.left = sun.shadow.camera.bottom = -16
    sun.shadow.camera.right = sun.shadow.camera.top = 16
    sun.shadow.camera.far = 60
    scene.add(sun)
    const rim = new THREE.DirectionalLight(0x22d3ee, 1.3)
    rim.position.set(-8, 4, -6)
    scene.add(rim)

    // 地面：反射开关就是改它的 metalness / roughness
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x1a2336,
      metalness: 0.9,
      roughness: 0.14,
      envMapIntensity: 1.1
    })
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), floorMat)
    floor.rotation.x = -Math.PI / 2
    floor.receiveShadow = true
    scene.add(floor)
    const grid = new THREE.GridHelper(80, 80, 0x2c4066, 0x172033)
    grid.position.y = 0.012
    scene.add(grid)

    // 中心主体
    const knot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(1.35, 0.34, 220, 32),
      new THREE.MeshStandardMaterial({ color: 0x9fb4d4, roughness: 0.28, metalness: 0.7 })
    )
    knot.position.y = 2.1
    knot.castShadow = true
    knot.receiveShadow = true
    scene.add(knot)

    // 环绕立柱（实例化，一个 draw call）
    const pillarGeo = new THREE.CylinderGeometry(0.16, 0.24, 2.4, 12)
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x24304a, roughness: 0.6, metalness: 0.3 })
    const pillars = new THREE.InstancedMesh(pillarGeo, pillarMat, 20)
    const dummy = new THREE.Object3D()
    for (let i = 0; i < 20; i++) {
      const a = i / 20 * Math.PI * 2
      dummy.position.set(Math.cos(a) * 6.6, 1.2, Math.sin(a) * 6.6)
      dummy.rotation.y = -a
      dummy.updateMatrix()
      pillars.setMatrixAt(i, dummy.matrix)
    }
    pillars.castShadow = true
    pillars.receiveShadow = true
    scene.add(pillars)

    // 粒子
    const COUNT = 2400
    const positions = new Float32Array(COUNT * 3)
    for (let i = 0; i < COUNT; i++) {
      const a = Math.random() * Math.PI * 2
      const r = 2 + Math.random() * 9
      positions[i * 3] = Math.cos(a) * r
      positions[i * 3 + 1] = Math.random() * 8 + 0.2
      positions[i * 3 + 2] = Math.sin(a) * r
    }
    const particleGeo = new THREE.BufferGeometry()
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
    const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
      color: 0x22d3ee,
      size: 0.06,
      transparent: true,
      opacity: 0.85,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    }))
    scene.add(particles)

    // 压测网格：重负载时才把 count 打开
    const STRESS_MAX = 1500
    const stressGeo = new THREE.TorusKnotGeometry(0.2, 0.065, 48, 10)
    const stressMat = new THREE.MeshStandardMaterial({ color: 0x4b5a78, roughness: 0.5, metalness: 0.3 })
    const stressMesh = new THREE.InstancedMesh(stressGeo, stressMat, STRESS_MAX)
    stressMesh.castShadow = true
    stressMesh.receiveShadow = true
    for (let i = 0; i < STRESS_MAX; i++) {
      const a = Math.random() * Math.PI * 2
      const r = 3 + Math.random() * 22
      dummy.position.set(Math.cos(a) * r, Math.random() * 9, Math.sin(a) * r)
      dummy.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6)
      dummy.scale.setScalar(0.6 + Math.random() * 1.2)
      dummy.updateMatrix()
      stressMesh.setMatrixAt(i, dummy.matrix)
    }
    stressMesh.count = 0
    scene.add(stressMesh)

    /* ---------- 后处理链 ---------- */
    const composer = new EffectComposer(renderer)
    composer.setPixelRatio(Math.min(devicePixelRatio, 2))
    const renderPass = new RenderPass(scene, camera)
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.5, 0.82)
    composer.addPass(renderPass)
    composer.addPass(bloomPass)
    composer.addPass(new OutputPass())
    composer.setSize(innerWidth, innerHeight)

    const timer = new THREE.Timer()
    timer.connect(document)

    /* ==================================================================
       ② 降级阶梯：每一档都写明「拆掉什么、省哪一类开销」
    ================================================================== */
    const LEVELS = [
      { name: 'L0 全画质', dpr: 2.0, bloom: true, shadows: true, reflect: true, particles: true, note: '基线' },
      { name: 'L1 降分辨率', dpr: 1.5, bloom: true, shadows: true, reflect: true, particles: true, note: '省像素填充' },
      { name: 'L2 关泛光', dpr: 1.5, bloom: false, shadows: true, reflect: true, particles: true, note: '省全屏后处理' },
      { name: 'L3 关阴影', dpr: 1.5, bloom: false, shadows: false, reflect: true, particles: true, note: '省阴影 Pass' },
      { name: 'L4 关反射', dpr: 1.25, bloom: false, shadows: false, reflect: false, particles: true, note: '省环境采样' },
      { name: 'L5 关粒子', dpr: 1.0, bloom: false, shadows: false, reflect: false, particles: false, note: '省透明叠加' },
      { name: 'L6 静态兜底', dpr: 1.0, bloom: false, shadows: false, reflect: false, particles: false, note: '停止渲染' }
    ]

    let level = 0
    let rendering = true
    const poster = document.getElementById('poster')

    function applyLevel(n, reason) {
      const L = LEVELS[n]
      const prev = level
      level = n

      renderer.setPixelRatio(Math.min(devicePixelRatio, L.dpr))
      composer.setPixelRatio(Math.min(devicePixelRatio, L.dpr))
      bloomPass.enabled = L.bloom
      sun.castShadow = L.shadows
      floorMat.metalness = L.reflect ? 0.9 : 0.05
      floorMat.roughness = L.reflect ? 0.14 : 0.95
      particles.visible = L.particles
      stressMesh.count = params.stress ? STRESS_MAX : 0

      if (n >= 6) {
        rendering = false
        poster.classList.add('show')
        renderer.setAnimationLoop(null)
      } else if (!rendering) {
        rendering = true
        poster.classList.remove('show')
        renderer.setAnimationLoop(tick)
      }

      document.getElementById('ladderName').textContent = L.name + ' · ' + L.note
      ;[...document.querySelectorAll('.chip')].forEach((c, i) => c.classList.toggle('on', i === n))

      record('level', { from: prev, to: n, reason })
      feed(`→ ${L.name}（${reason}）`, n > 0 ? 'lv' : 'up')
    }

    /* ==================================================================
       ③ 遥测：本地缓冲 → 去重聚合 → 按会话采样 → dry-run 发送
    ================================================================== */
    const SESSION = {
      id: Math.random().toString(36).slice(2, 10),
      sampled: true,
      start: Date.now()
    }

    const pending = new Map()   // key → 聚合后的事件
    let sentBatches = 0
    let droppedBatches = 0
    let lastPayload = null

    function record(type, meta = {}) {
      const key = type + '|' + (meta.from ?? '') + '>' + (meta.to ?? '')
      const now = Math.round(performance.now())
      const item = pending.get(key)
      if (item) {
        item.n++
        item.t1 = now
      } else {
        pending.set(key, { type, n: 1, t0: now, t1: now, ...meta })
      }
      renderCounters()
    }

    function pendingCount() {
      let n = 0
      for (const e of pending.values()) n += e.n
      return n
    }

    function flush() {
      if (!pending.size) return
      if (SESSION.sampled) {
        const events = [...pending.values()].map((e) => ({
          type: e.type, n: e.n, from: e.from, to: e.to, t0: e.t0, t1: e.t1
        }))
        lastPayload = {
          schema: 'tlm/1',
          v: '2.6.0',
          scene: 'telemetry-pipeline',
          sid: SESSION.id,
          dims: {
            gpu: GPU.slice(0, 36),
            screen: screen.width + 'x' + screen.height,
            dpr: devicePixelRatio,
            level,
            tier: 'mid'
          },
          win: {
            fps: Math.round(lastFps),
            frameMs: +lastMs.toFixed(1),
            budgetMs: 16.6
          },
          events
        }
        sentBatches++
        // 真项目这里换成 navigator.sendBeacon('/tlm', blob)。
        // 演示页刻意不联网：payload 只落在控制台和右侧浮层。
        console.log('[telemetry:dry-run]', lastPayload)
        document.getElementById('payload').textContent =
          JSON.stringify(lastPayload, null, 0).slice(0, 1400)
      } else {
        droppedBatches++
        document.getElementById('payload').textContent =
          `本会话未命中采样：${pendingCount()} 条事件已丢弃，仅保留本地计数`
      }
      pending.clear()
      renderCounters()
    }

    /* ---------- 端点与维度（真正安全的上报字段） ---------- */
    const gl = renderer.getContext()
    const dbgExt = gl.getExtension('WEBGL_debug_renderer_info')
    const GPU = dbgExt
      ? String(gl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL)).replace(/\s+/g, ' ')
      : 'unknown'
    const MAX_TEX = gl.getParameter(gl.MAX_TEXTURE_SIZE)
    const IS_WEBGL2 = typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext

    /* ==================================================================
       ④ 帧时间窗口 + 迟滞（hysteresis）控制器
          连续 3 个窗口 < 50fps 才降一档；连续 4 个窗口 > 56fps 才升一档。
    ================================================================== */
    let lastRaf = performance.now()
    let frameAcc = 0
    let frameN = 0
    let lastFps = 60
    let lastMs = 16.6
    let lowStreak = 0
    let highStreak = 0
    let lastChange = 0
    const WINDOW = 20

    const history = []
    const spark = document.getElementById('spark')
    const sparkCtx = spark.getContext('2d')

    function drawSpark() {
      if (!sparkCtx) return
      const w = spark.width
      const h = spark.height
      sparkCtx.clearRect(0, 0, w, h)
      sparkCtx.fillStyle = 'rgba(8,12,20,.9)'
      sparkCtx.fillRect(0, 0, w, h)

      // 预算线 60fps
      sparkCtx.strokeStyle = 'rgba(251,191,36,.45)'
      sparkCtx.lineWidth = 1
      sparkCtx.beginPath()
      sparkCtx.moveTo(0, h - (60 / 130) * h)
      sparkCtx.lineTo(w, h - (60 / 130) * h)
      sparkCtx.stroke()

      const n = history.length
      const bw = w / 40
      for (let i = 0; i < n; i++) {
        const v = Math.min(history[i], 130)
        const x = w - (n - i) * bw
        const bh = (v / 130) * h
        sparkCtx.fillStyle = v < 50 ? '#f87171' : v < 57 ? '#fbbf24' : '#34d399'
        sparkCtx.fillRect(x + 1, h - bh, bw - 2, bh)
      }
    }

    function onWindow(avgMs) {
      const fps = 1000 / avgMs
      lastFps = fps
      lastMs = avgMs
      history.push(fps)
      if (history.length > 40) history.shift()
      drawSpark()

      const fEl = document.getElementById('mFps')
      const mEl = document.getElementById('mMs')
      fEl.textContent = Math.round(fps)
      mEl.textContent = avgMs.toFixed(1)
      fEl.className = fps < 50 ? 'bad' : fps < 57 ? 'warn' : 'ok'
      mEl.className = fps < 50 ? 'bad' : fps < 57 ? 'warn' : 'ok'

      record('frame', { from: fps < 50 ? 'bad' : fps < 57 ? 'warn' : 'ok', to: '' })

      if (!params.auto) return
      const now = performance.now()
      if (now - lastChange < 1400) return

      if (fps < 50) {
        lowStreak++
        highStreak = 0
      } else if (fps > 56) {
        highStreak++
        lowStreak = 0
      } else {
        lowStreak = 0
        highStreak = 0
      }

      if (lowStreak >= 3 && level < 6) {
        lowStreak = 0
        lastChange = now
        applyLevel(level + 1, '连续 3 窗口 < 50fps')
      } else if (highStreak >= 4 && level > 0 && level < 6) {
        highStreak = 0
        lastChange = now
        applyLevel(level - 1, '连续 4 窗口 > 56fps')
      }
    }

    /* ---------- 面板 ---------- */
    function feed(text, cls = '') {
      const el = document.getElementById('evlog')
      const d = document.createElement('div')
      const t = new Date().toLocaleTimeString('zh-CN', { hour12: false })
      d.className = cls
      d.textContent = `[${t}] ${text}`
      el.prepend(d)
      while (el.children.length > 6) el.lastChild.remove()
    }

    function renderCounters() {
      document.getElementById('mPending').textContent = pendingCount()
      document.getElementById('mSent').textContent = sentBatches
      document.getElementById('mDrop').textContent = droppedBatches
      document.getElementById('mTypes').textContent = pending.size
    }

    function renderSampleBadge() {
      const el = document.getElementById('sampleBadge')
      el.textContent = SESSION.sampled ? '会话已采样' : '未命中采样'
      el.className = 'badge' + (SESSION.sampled ? '' : ' off')
    }

    function newSession() {
      SESSION.id = Math.random().toString(36).slice(2, 10)
      SESSION.sampled = Math.random() < params.sampleRate
      SESSION.start = Date.now()
      renderSampleBadge()
      feed(SESSION.sampled ? '会话命中采样，开始采集' : '会话未命中采样，只保留本地缓冲')
    }

    /* ---------- 阶梯芯片 ---------- */
    const ladderEl = document.getElementById('ladder')
    LEVELS.forEach((L, i) => {
      const c = document.createElement('span')
      c.className = 'chip' + (i === 0 ? ' on' : '')
      c.textContent = 'L' + i
      c.title = L.name
      ladderEl.appendChild(c)
    })

    /* ==================================================================
       ⑤ 主循环：真实帧时间 + 可开关的合成负载
    ================================================================== */
    const params = {
      stress: false,
      stressMs: 12,
      sampleRate: 0.5,
      auto: true,
      level: 0,
      重负载: false,
      重新抽取会话: () => newSession(),
      立即上报: () => flush(),
      重置画质: () => {
        stressMesh.count = 0
        applyLevel(0, '手动重置')
      }
    }

    function busy(ms) {
      if (!ms) return
      const t0 = performance.now()
      while (performance.now() - t0 < ms) { /* 合成负载：模拟业务主线程被占 */ }
    }

    function tick() {
      const now = performance.now()
      const raw = now - lastRaf
      lastRaf = now

      timer.update()
      const dt = Math.min(timer.getDelta(), 0.05)
      const t = timer.getElapsed()

      knot.rotation.y = t * 0.5
      knot.rotation.x = Math.sin(t * 0.4) * 0.28
      knot.position.y = 2.1 + Math.sin(t * 1.2) * 0.18
      particles.rotation.y = t * 0.1
      rim.intensity = 0.9 + Math.sin(t * 2) * 0.35

      controls.update()
      if (!params.stress) stressMesh.count = 0

      if (params.stress) busy(params.stressMs)

      composer.render()

      if (raw > 0 && raw < 500) {
        frameAcc += raw
        frameN++
        if (frameN >= WINDOW) {
          const avg = frameAcc / frameN
          frameAcc = 0
          frameN = 0
          onWindow(avg)
        }
      }
    }

    renderer.setAnimationLoop(tick)
    setInterval(flush, 3000)

    /* ---------- GUI ---------- */
    const gui = new GUI({ title: '遥测与降级' })
    gui.add(params, '重负载').name('重负载').onChange((v) => {
      params.stress = v
      stressMesh.count = v ? STRESS_MAX : 0
      record('stress', { from: String(v), to: '' })
      feed(v ? '注入重负载：1500 个实例 + 12ms 主线程占用' : '解除重负载，等待迟滞恢复', v ? 'lv' : 'up')
    })
    gui.add(params, 'stressMs', 0, 20, 1).name('合成负载 (ms/帧)')
    gui.add(params, 'sampleRate', 0.05, 1, 0.05).name('会话采样率')
    gui.add(params, '重新抽取会话')
    gui.add(params, '立即上报')
    const autoCtl = gui.add(params, 'auto').name('自动降级').onChange((v) => {
      params.level = level
      levelCtl.disable(v)
      lowStreak = highStreak = 0
      feed(v ? '切回自动调节' : '切到手动档位')
    })
    const levelCtl = gui.add(params, 'level', 0, 5, 1).name('手动档位')
      .onChange((v) => { if (!params.auto) applyLevel(v, '手动选择') })
    levelCtl.disable(true)
    gui.add(params, '重置画质')

    /* ---------- 启动 ---------- */
    newSession()
    applyLevel(0, '初始化')
    record('boot', {
      from: (IS_WEBGL2 ? 'webgl2' : 'webgl1') + '|maxTex' + MAX_TEX,
      to: GPU
    })
    feed(`GPU：${GPU.slice(0, 40)}`)
    drawSpark()

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
      composer.setSize(innerWidth, innerHeight)
      if (params.stress) stressMesh.count = STRESS_MAX
    })

    // 长任务：与帧时间分开观测，才能分清 CPU 卡顿和 GPU 卡顿
    try {
      new PerformanceObserver((list) => {
        const n = list.getEntries().length
        if (n) record('longtask', {})
      }).observe({ entryTypes: ['longtask'] })
    } catch (e) { /* Safari 不支持则跳过 */ }
  </script>
</body>

</html>
