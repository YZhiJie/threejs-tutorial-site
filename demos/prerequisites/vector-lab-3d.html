<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vector-lab-3d · 点积与叉积 3D 实验室（Three.js 版）</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    #app canvas {
      display: block;
    }

    .info {
      position: fixed;
      top: 14px;
      left: 14px;
      max-width: 380px;
      padding: 12px 14px;
      background: rgba(11, 14, 20, .72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.7;
      pointer-events: none;
    }

    .info b {
      color: #7cc4ff;
    }

    .row {
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
    }

    .num-a {
      color: #7cc4ff;
    }

    .num-b {
      color: #ffa94d;
    }

    .num-c {
      color: #b294ff;
    }

    .note {
      margin-top: 4px;
      font-size: 11.5px;
      color: #9fb4d4;
    }

    .badge {
      display: inline-block;
      padding: 0 8px;
      margin-left: 6px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 18px;
      vertical-align: 1px;
    }

    .badge.pos {
      color: #51cf66;
      background: rgba(81, 207, 102, .12);
      border: 1px solid rgba(81, 207, 102, .35);
    }

    .badge.neg {
      color: #ff6b6b;
      background: rgba(255, 107, 107, .12);
      border: 1px solid rgba(255, 107, 107, .35);
    }

    .badge.zero {
      color: #9fb4d4;
      background: rgba(159, 180, 212, .1);
      border: 1px solid rgba(159, 180, 212, .3);
    }

    .ctrls {
      margin-top: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: auto;
    }

    .ctrls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .ctrls input {
      accent-color: #7cc4ff;
      margin: 0;
    }

    .ctrls button {
      background: rgba(124, 196, 255, .1);
      color: #7cc4ff;
      border: 1px solid rgba(124, 196, 255, .35);
      border-radius: 6px;
      padding: 2px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .ctrls button:hover {
      background: rgba(124, 196, 255, .2);
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(11, 14, 20, .72);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .info {
        max-width: 260px;
        font-size: 12px;
      }

      .row {
        font-size: 11.5px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="app"></div>

  <div class="info">
    <b>vector-lab-3d · 点积与叉积立体实验室</b>
    <div class="row">A <span class="num-a" id="va"></span></div>
    <div class="row">B <span class="num-b" id="vb"></span> · θ = <span id="vth"></span></div>
    <div class="row">A·B = <span id="vdot"></span><span id="bdot" class="badge"></span></div>
    <div class="row">A×B <span class="num-c" id="vcross"></span></div>
    <div class="row">|A×B| = <span id="vmag"></span>（= 面积）<span id="bmag" class="badge"></span></div>
    <div class="note">右手定则：四指从 A 弯向 B，拇指即紫色 C 的方向——C 同时⊥A、B。坐标轴 X 红 / Y 绿 / Z 蓝。箭头用 MeshStandardMaterial：灯光缺失时一片黑（PBR
      特性）。</div>
    <div class="ctrls">
      <label><input type="checkbox" id="ckPara" checked>平行四边形</label>
      <label><input type="checkbox" id="ckProj" checked>投影</label>
      <label><input type="checkbox" id="ckArc" checked>夹角弧</label>
      <button id="btnReset" type="button">重置</button>
    </div>
  </div>

  <div class="hint">拖拽 A / B 箭头端点改变向量 · 左键旋转视角 · 滚轮缩放 · 右键平移</div>

  <script type="module">
    // Three.js 版向量实验室：与零依赖版 vector-lab.html 同一套数学，
    // 区别在于"画箭头"的活全部交给 Three.js —— 对照感受高层封装省掉了什么。
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

    const clampN = (v, lo, hi) => Math.min(hi, Math.max(lo, v))

    // ---------- 1. 场景 / 相机 / 渲染器 / 灯光 ----------
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100)
    camera.position.set(4.6, 3.0, 5.6)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    document.getElementById('app').appendChild(renderer.domElement)

    // PBR 材质依赖灯光：没有灯 Standard 材质就是纯黑（对应教程「渲染常识」小节）
    scene.add(new THREE.HemisphereLight(0xbfd8ff, 0x1a2030, 1.2))
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6)
    dirLight.position.set(4, 6, 3)
    scene.add(dirLight)

    // ---------- 2. 地面网格 + 右手系坐标轴 ----------
    const grid = new THREE.GridHelper(10, 10, 0x3a4a6b, 0x232c40)
    grid.position.y = -2.2
    scene.add(grid)
    const O = new THREE.Vector3(0, 0, 0)
    scene.add(
      new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), O, 2.6, 0xff6b6b, 0.16, 0.08),
      new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), O, 2.6, 0x51cf66, 0.16, 0.08),
      new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), O, 2.6, 0x5c9dff, 0.16, 0.08)
    )

    // ---------- 3. 数据与向量对象 ----------
    const INIT = { a: new THREE.Vector3(2.5, 0.6, 0), b: new THREE.Vector3(1.2, 1.8, 0.3) }
    let A = INIT.a.clone(), B = INIT.b.clone()
    const COL = { a: 0x7cc4ff, b: 0xffa94d, c: 0xb294ff }

    // 网格箭头：圆柱杆 + 圆锥头，用四元数把默认 +Y 转到目标方向
    // （欧拉角之外的另一种旋转表示，正好呼应教程「欧拉角 vs 四元数」小节）
    function makeMeshArrow(color) {
      const g = new THREE.Group()
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.1 })
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 1, 16), mat)
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.26, 20), mat)
      g.add(shaft, head)
      const UP = new THREE.Vector3(0, 1, 0)
      return {
        g,
        set(dir, len) {
          g.quaternion.setFromUnitVectors(UP, dir.clone().normalize())
          const shaftLen = Math.max(len - 0.26, 0.01)
          shaft.scale.set(1, shaftLen, 1)
          shaft.position.y = shaftLen / 2
          head.position.y = len - 0.13
        }
      }
    }
    const arrowA = makeMeshArrow(COL.a)
    const arrowB = makeMeshArrow(COL.b)
    const arrowC = makeMeshArrow(COL.c)
    scene.add(arrowA.g, arrowB.g, arrowC.g)

    // 端点手柄小球（可拖拽）
    function makeHandle(color) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 16, 12),
        new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.35, roughness: 0.3 })
      )
    }
    const handleA = makeHandle(COL.a)
    const handleB = makeHandle(COL.b)
    scene.add(handleA, handleB)

    // 平行四边形（A、B 张成）—— 叉积 = 它的有向面积
    const paraGeo = new THREE.BufferGeometry()
    paraGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(4 * 3), 3))
    paraGeo.setIndex([0, 1, 2, 0, 2, 3])
    const para = new THREE.Mesh(paraGeo, new THREE.MeshBasicMaterial({
      color: COL.c, transparent: true, opacity: 0.14, side: THREE.DoubleSide, depthWrite: false
    }))
    scene.add(para)
    const paraLineGeo = new THREE.BufferGeometry()
    paraLineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(4 * 3), 3))
    const paraLine = new THREE.LineLoop(paraLineGeo, new THREE.LineBasicMaterial({
      color: COL.c, transparent: true, opacity: 0.5
    }))
    scene.add(paraLine)

    // 投影虚线：origin→F（A 色）与 B→F（灰）
    function makeDash(color, opacity) {
      const geo = new THREE.BufferGeometry()
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(2 * 3), 3))
      return new THREE.Line(geo, new THREE.LineDashedMaterial({
        color, dashSize: 0.14, gapSize: 0.09, transparent: true, opacity
      }))
    }
    const projLine = makeDash(COL.a, 0.9)
    const perpLine = makeDash(0x8a97a8, 0.7)
    scene.add(projLine, perpLine)

    // 夹角弧：从 A 方向转到 B 方向的短弧
    const arcGeo = new THREE.BufferGeometry()
    arcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(33 * 3), 3))
    const arc = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({ color: 0xe6edf3, transparent: true, opacity: 0.6 }))
    scene.add(arc)

    function setXYZ(arr, i, v) { arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z }
    function updateDash(line, p1, p2) {
      const arr = line.geometry.attributes.position.array
      setXYZ(arr, 0, p1); setXYZ(arr, 1, p2)
      line.geometry.attributes.position.needsUpdate = true
      line.computeLineDistances()  // 虚线必须重算线段距离，否则 dash 不会更新
    }

    // ---------- 4. 每帧同步 ----------
    function updateScene() {
      arrowA.set(A, A.length()); arrowB.set(B, B.length())
      handleA.position.copy(A); handleB.position.copy(B)

      // 叉积：同时垂直于 A、B，方向由右手定则决定
      const cross = new THREE.Vector3().crossVectors(A, B)
      const mag = cross.length()
      arrowC.g.visible = mag > 1e-4
      if (arrowC.g.visible) arrowC.set(cross, clampN(mag, 0.3, 4.6))

      // 平行四边形四顶点：0 → A → A+B → B
      const D = A.clone().add(B)
      const pp = paraGeo.attributes.position.array
      setXYZ(pp, 0, O); setXYZ(pp, 1, A); setXYZ(pp, 2, D); setXYZ(pp, 3, B)
      paraGeo.attributes.position.needsUpdate = true
      const lp = paraLineGeo.attributes.position.array
      setXYZ(lp, 0, O); setXYZ(lp, 1, A); setXYZ(lp, 2, D); setXYZ(lp, 3, B)
      paraLineGeo.attributes.position.needsUpdate = true

      // 投影：F = (A·B / |A|²) · A
      const la2 = A.lengthSq()
      const showProj = la2 > 1e-6 && ckProj.checked
      projLine.visible = perpLine.visible = showProj
      if (showProj) {
        const F = A.clone().multiplyScalar(A.dot(B) / la2)
        updateDash(projLine, O, F)
        updateDash(perpLine, B, F)
      }

      // 夹角弧
      const na = A.clone().normalize(), nb = B.clone().normalize()
      const axis = new THREE.Vector3().crossVectors(na, nb)
      arc.visible = axis.lengthSq() > 1e-8 && ckArc.checked
      if (arc.visible) {
        const ang = Math.acos(clampN(na.dot(nb), -1, 1))
        const r = clampN(0.3 * Math.min(A.length(), B.length()), 0.25, 0.7)
        const q = new THREE.Quaternion(), arr = arcGeo.attributes.position.array
        axis.normalize()
        for (let i = 0; i <= 32; i++) {
          q.setFromAxisAngle(axis, (i / 32) * ang)
          setXYZ(arr, i, na.clone().applyQuaternion(q).multiplyScalar(r))
        }
        arcGeo.attributes.position.needsUpdate = true
      }

      para.visible = paraLine.visible = ckPara.checked
      updatePanel(A.dot(B), cross, mag)
    }

    // ---------- 5. 面板数值 ----------
    const $ = id => document.getElementById(id)
    const elA = $('va'), elB = $('vb'), elTh = $('vth')
    const elDot = $('vdot'), elDotB = $('bdot')
    const elCr = $('vcross'), elMag = $('vmag'), elMagB = $('bmag')
    const ckPara = $('ckPara'), ckProj = $('ckProj'), ckArc = $('ckArc')

    const fmt = v => (v >= 0 ? '+' : '-') + Math.abs(v).toFixed(2)
    function setText(el, s) { if (el.__v !== s) { el.__v = s; el.textContent = s } }
    function badge(el, text, cls) {
      setText(el, text)
      const c = 'badge ' + cls
      if (el.__c !== c) { el.__c = c; el.className = c }
    }

    function updatePanel(dot, cross, mag) {
      setText(elA, `(${A.x.toFixed(2)}, ${A.y.toFixed(2)}, ${A.z.toFixed(2)})`)
      setText(elB, `(${B.x.toFixed(2)}, ${B.y.toFixed(2)}, ${B.z.toFixed(2)})`)
      const la = A.length(), lb = B.length()
      const cosT = la * lb > 1e-6 ? clampN(dot / (la * lb), -1, 1) : 1
      const th = Math.acos(cosT) * 180 / Math.PI
      setText(elTh, th.toFixed(1) + '°')
      setText(elDot, fmt(dot))
      if (Math.abs(th - 90) < 1) badge(elDotB, '垂直', 'zero')
      else if (dot > 0) badge(elDotB, '同向 · 锐角', 'pos')
      else badge(elDotB, '反向 · 钝角', 'neg')

      setText(elCr, `(${cross.x.toFixed(2)}, ${cross.y.toFixed(2)}, ${cross.z.toFixed(2)})`)
      setText(elMag, fmt(mag))
      badge(elMagB, mag < 0.05 * la * lb ? '共线 · C≈0' : 'C 同时⊥A、B', mag < 0.05 * la * lb ? 'zero' : 'pos')
    }

    // ---------- 6. 交互：拖拽端点 / 环绕视角 ----------
    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true

    const raycaster = new THREE.Raycaster()
    const ndc = new THREE.Vector2()
    const dragPlane = new THREE.Plane()
    const hitPoint = new THREE.Vector3()
    const camDir = new THREE.Vector3()
    let drag = null, hover = null

    function pick(clientX, clientY) {
      ndc.set((clientX / window.innerWidth) * 2 - 1, -(clientY / window.innerHeight) * 2 + 1)
      raycaster.setFromCamera(ndc, camera)
      const hits = raycaster.intersectObjects([handleA, handleB], false)
      return hits.length ? (hits[0].object === handleA ? 'A' : 'B') : null
    }
    // 把向量钳制在安全范围内：分量 ±4.5，长度 0.6 ~ 4.5
    function clampVec(v) {
      v.x = clampN(v.x, -4.5, 4.5); v.y = clampN(v.y, -4.5, 4.5); v.z = clampN(v.z, -4.5, 4.5)
      const l = v.length()
      if (l > 4.5) v.multiplyScalar(4.5 / l)
      else if (l > 1e-6 && l < 0.6) v.multiplyScalar(0.6 / l)
      return v
    }

    renderer.domElement.addEventListener('pointerdown', e => {
      const h = pick(e.clientX, e.clientY)
      if (h) {
        drag = h
        controls.enabled = false  // 拖向量时暂停轨道控制，避免"一边转视角一边拉箭头"
        renderer.domElement.setPointerCapture(e.pointerId)
        renderer.domElement.style.cursor = 'grabbing'
      }
    })
    renderer.domElement.addEventListener('pointermove', e => {
      if (!drag) {
        hover = pick(e.clientX, e.clientY)
        renderer.domElement.style.cursor = hover ? 'grab' : ''
        return
      }
      // 在"过端点、垂直于视线"的平面上移动——3D 拖拽的标准技巧
      ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1)
      raycaster.setFromCamera(ndc, camera)
      camera.getWorldDirection(camDir)
      dragPlane.setFromNormalAndCoplanarPoint(camDir, drag === 'A' ? A : B)
      if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
        // 在平面上挪动被拖拽的向量端点（先钳制再写回）
        if (drag === 'A') A.copy(clampVec(hitPoint))
        else B.copy(clampVec(hitPoint))
      }
    })
    const endDrag = () => {
      drag = null
      controls.enabled = true
      renderer.domElement.style.cursor = hover ? 'grab' : ''
    }
    renderer.domElement.addEventListener('pointerup', endDrag)
    renderer.domElement.addEventListener('pointercancel', endDrag)

    // ---------- 7. 开关 / 重置 / 自适应 / 渲染循环 ----------
    $('btnReset').addEventListener('click', () => { A.copy(INIT.a); B.copy(INIT.b) })
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    renderer.setAnimationLoop(() => {
      controls.update()      // 开了 damping 就必须每帧 update
      updateScene()
      renderer.render(scene, camera)
    })
  </script>
</body>

</html>
