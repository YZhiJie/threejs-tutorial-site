<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>webgpu-renderer-lab · WebGPURenderer + 程序化 IBL</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .info {
      position: fixed;
      top: 14px;
      left: 14px;
      max-width: 352px;
      padding: 12px 14px;
      background: rgba(11, 14, 20, .82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 10px;
      font-size: 12.5px;
      line-height: 1.65;
      pointer-events: none;
    }

    .info b {
      color: #7cc4ff;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 3px;
    }

    .row .k {
      flex: none;
      width: 76px;
      color: #94a3b8;
    }

    .row .v {
      color: #e2e8f0;
      word-break: break-all;
    }

    .ok {
      color: #34d399;
    }

    .warn {
      color: #fbbf24;
    }

    .bad {
      color: #fb7185;
    }

    .note {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      color: #fbbf24;
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(11, 14, 20, .72);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: none;
      white-space: nowrap;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: .08em;
      background: #0b0e14;
      transition: opacity .35s;
    }

    .loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .lil-gui.root {
      --width: 252px;
    }

    @media (max-width: 680px) {
      .info {
        max-width: 212px;
        font-size: 11.5px;
      }

      .row .k {
        width: 62px;
      }

      .lil-gui.root {
        --width: 192px;
      }

      .hint {
        max-width: 84vw;
        white-space: normal;
        text-align: center;
        font-size: 11px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js"
    }
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <div class="loading" id="loading">正在初始化渲染后端…</div>
  <div class="info">
    <b>WebGPURenderer · 程序化 IBL</b><br />
    three/webgpu 入口 + 自动回退；环境贴图由 Canvas 生成，不加载任何外部图片。<br />
    <div class="row"><span class="k">渲染器</span><span class="v">WebGPURenderer</span></div>
    <div class="row"><span class="k">实际后端</span><span class="v" id="backend">初始化中…</span></div>
    <div class="row"><span class="k">navigator.gpu</span><span class="v" id="has-gpu">—</span></div>
    <div class="row"><span class="k">环境贴图</span><span class="v">Equirect 1024×512 · 程序化</span></div>
    <div class="row"><span class="k">NodeMaterial</span><span class="v">MeshStandardMaterial 自动转换</span></div>
    <span class="note" id="note"></span>
  </div>
  <div class="hint">右上角切换 forceWebGL · 拖拽旋转 · 滚轮缩放 · 看金属球的高光与反射</div>

  <script type="module">
    import * as THREE from 'three/webgpu'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import GUI from 'three/addons/libs/lil-gui.module.min.js'

    const $ = (id) => document.getElementById(id)

    /* ---------- 场景 ---------- */
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)
    scene.fog = new THREE.Fog(0x0b0e14, 8, 18)

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100)
    camera.position.set(0.4, 1.15, 5.4)

    /* ---------- 程序化 equirect 环境 ---------- */
    function makeEnvironmentTexture() {
      const canvas = document.createElement('canvas')
      canvas.width = 1024
      canvas.height = 512
      const ctx = canvas.getContext('2d')

      const sky = ctx.createLinearGradient(0, 0, 0, 512)
      sky.addColorStop(0.0, '#070b16')
      sky.addColorStop(0.34, '#16234a')
      sky.addColorStop(0.52, '#4c2a72')
      sky.addColorStop(0.62, '#8a4a5f')
      sky.addColorStop(0.78, '#151b2e')
      sky.addColorStop(1.0, '#080b12')
      ctx.fillStyle = sky
      ctx.fillRect(0, 0, 1024, 512)

      const sun = ctx.createRadialGradient(720, 170, 4, 720, 170, 190)
      sun.addColorStop(0.0, 'rgba(255, 244, 214, 1)')
      sun.addColorStop(0.18, 'rgba(255, 184, 96, .92)')
      sun.addColorStop(0.5, 'rgba(244, 114, 182, .34)')
      sun.addColorStop(1.0, 'rgba(124, 58, 237, 0)')
      ctx.fillStyle = sun
      ctx.fillRect(440, 0, 560, 400)

      const cool = ctx.createRadialGradient(210, 300, 6, 210, 300, 170)
      cool.addColorStop(0.0, 'rgba(34, 211, 238, .95)')
      cool.addColorStop(0.45, 'rgba(34, 211, 238, .26)')
      cool.addColorStop(1.0, 'rgba(34, 211, 238, 0)')
      ctx.fillStyle = cool
      ctx.fillRect(0, 120, 460, 360)

      ctx.fillStyle = 'rgba(226, 232, 240, .85)'
      for (let i = 0; i < 5; i++) {
        const x = 120 + i * 190
        const w = 16 + (i % 2) * 22
        ctx.fillRect(x, 118, w, 250)
      }

      ctx.globalAlpha = 0.55
      for (let i = 0; i < 42; i++) {
        const x = (i * 173) % 1024
        const y = 30 + ((i * 97) % 330)
        const r = 1 + (i % 3)
        ctx.fillStyle = i % 4 === 0 ? '#fbbf24' : '#dbeafe'
        ctx.beginPath()
        ctx.arc(x, y, r, 0, Math.PI * 2)
        ctx.fill()
      }
      ctx.globalAlpha = 1

      const tex = new THREE.CanvasTexture(canvas)
      tex.mapping = THREE.EquirectangularReflectionMapping
      tex.colorSpace = THREE.SRGBColorSpace
      return tex
    }

    const envTex = makeEnvironmentTexture()
    scene.environment = envTex
    scene.environmentIntensity = 1.15
    scene.environmentRotation = new THREE.Euler(0, 0.6, 0)

    /* ---------- 物体 ---------- */
    const sphereMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.06 }),
      new THREE.MeshStandardMaterial({ color: 0xdfe8ff, metalness: 0.95, roughness: 0.24 }),
      new THREE.MeshStandardMaterial({ color: 0xf6c68a, metalness: 0.9, roughness: 0.48 })
    ]

    const spheres = new THREE.Group()
    sphereMaterials.forEach((mat, i) => {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.62, 64, 48), mat)
      mesh.position.set((i - 1) * 1.62, 0.75, 0)
      spheres.add(mesh)
    })
    scene.add(spheres)

    const knot = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.92, 0.26, 180, 28),
      new THREE.MeshStandardMaterial({ color: 0x7cc4ff, metalness: 0.85, roughness: 0.18 })
    )
    knot.position.set(0, 1.75, -0.2)
    knot.scale.setScalar(0.72)
    scene.add(knot)

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(7, 72),
      new THREE.MeshStandardMaterial({ color: 0x0f1524, metalness: 0.35, roughness: 0.6 })
    )
    floor.rotation.x = -Math.PI / 2
    scene.add(floor)

    const grid = new THREE.GridHelper(14, 28, 0x233456, 0x17223a)
    grid.position.y = 0.02
    scene.add(grid)

    const params = {
      forceWebGL: !navigator.gpu,
      rotate: true,
      envIntensity: 1.15
    }

    /* ---------- 渲染器（可重建） ---------- */
    let renderer = null
    let controls = null
    let backendLabel = ''

    function updateBackendUI() {
      const el = $('backend')
      const isWebGPU = !!(renderer && renderer.backend && renderer.backend.isWebGPUBackend)
      backendLabel = isWebGPU ? 'WebGPU 原生' : 'WebGL2（回退 / forceWebGL）'
      el.textContent = backendLabel
      el.className = 'v ' + (isWebGPU ? 'ok' : 'warn')

      if (!navigator.gpu) {
        $('note').textContent = '当前浏览器不支持 WebGPU，已自动回退 WebGL2；画面仍可正常交互。'
      } else if (!isWebGPU && params.forceWebGL) {
        $('note').textContent = 'forceWebGL 已开启：同一套场景在 WebGL2 后端渲染，用于对比。'
      } else if (!isWebGPU) {
        $('note').textContent = 'WebGPU 初始化失败，已回退 WebGL2；画面仍可正常交互。'
      } else {
        $('note').textContent = 'WebGPU 后端运行中；取消 forceWebGL 可切回原生后端。'
      }
    }

    async function buildRenderer(forceWebGL) {
      if (renderer) {
        renderer.setAnimationLoop(null)
        renderer.dispose()
        renderer.domElement.remove()
      }
      if (controls) {
        controls.dispose()
        controls = null
      }
      $('loading').classList.remove('hide')
      $('loading').textContent = '正在初始化 ' + (forceWebGL ? 'WebGL2' : 'WebGPU') + ' 后端…'

      let next = null
      try {
        next = new THREE.WebGPURenderer({ antialias: true, forceWebGL })
        next.setSize(innerWidth, innerHeight)
        next.setPixelRatio(Math.min(devicePixelRatio, 2))
        next.toneMapping = THREE.ACESFilmicToneMapping
        next.toneMappingExposure = 1.1
        await next.init()
      } catch (err) {
        if (!forceWebGL) {
          $('loading').textContent = 'WebGPU 初始化失败，正在回退…'
          return buildRenderer(true)
        }
        $('loading').textContent = '无法创建任何渲染后端：' + err.message
        $('note').textContent = '请尝试更新浏览器或启用 WebGL2。'
        return
      }

      renderer = next
      $('app').appendChild(renderer.domElement)
      controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      controls.target.set(0, 0.85, 0)
      controls.minDistance = 2.6
      controls.maxDistance = 13

      updateBackendUI()
      $('loading').classList.add('hide')

      const timer = new THREE.Timer()
      timer.connect(document)
      renderer.setAnimationLoop(() => {
        timer.update()
        const dt = Math.min(timer.getDelta(), 0.05)
        if (params.rotate) {
          spheres.rotation.y += dt * 0.28
          knot.rotation.x += dt * 0.5
          knot.rotation.y += dt * 0.4
        }
        controls.update()
        renderer.render(scene, camera)
      })
    }

    /* ---------- GUI ---------- */
    const gui = new GUI({ title: 'WebGPU 参数' })
    const forceCtrl = gui.add(params, 'forceWebGL').name('forceWebGL').onChange((v) => buildRenderer(v))
    if (!navigator.gpu) forceCtrl.disable()
    gui.add(params, 'rotate').name('自动旋转')
    gui.add(params, 'envIntensity', 0, 2, 0.01).name('environmentIntensity')
      .onChange((v) => { scene.environmentIntensity = v })

    $('has-gpu').textContent = navigator.gpu ? '存在' : '不存在'
    $('has-gpu').className = 'v ' + (navigator.gpu ? 'ok' : 'bad')

    await buildRenderer(params.forceWebGL)

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      if (renderer) renderer.setSize(innerWidth, innerHeight)
    })
  </script>
</body>

</html>
