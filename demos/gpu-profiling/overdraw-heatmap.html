<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>overdraw-heatmap · Overdraw 热力图</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .info {
      position: fixed;
      top: 14px;
      left: 14px;
      max-width: 372px;
      padding: 12px 14px;
      background: rgba(11, 14, 20, .74);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.65;
      pointer-events: none;
    }

    .info b {
      color: #7cc4ff;
    }

    .info .num {
      font-family: 'SF Mono', Consolas, monospace;
      color: #e2e8f0;
    }

    .info .hi {
      color: #f472b6;
    }

    .info .ok {
      color: #34d399;
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(11, 14, 20, .72);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: none;
      white-space: nowrap;
    }

    .lil-gui.root {
      --width: 258px;
    }

    @media (max-width: 640px) {
      .info {
        max-width: 216px;
        font-size: 12px;
      }

      .lil-gui.root {
        --width: 196px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <div class="info">
    <b>overdraw-heatmap · Overdraw 热力图</b><br />
    同一叠半透明面板，两种看法：正常叠加只剩一片亮；热力图按「这一像素被画了几次」着色。<br />
    平均 overdraw <span class="num hi" id="hudAvg">--</span> 倍 ·
    估算片元 <span class="num" id="hudFrags">--</span> MP ·
    基准 1× <span class="num" id="hudBase">--</span> MP<br />
    面板 <span class="num" id="hudPanels">--</span> 层 ·
    实际绘制 <span class="num" id="hudCalls">--</span> 次 · 帧率 <span class="num" id="hudFps">--</span>
  </div>
  <div class="hint">右上角切换「正常 / 热力图」· 拖拽旋转 · 滚轮缩放</div>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import GUI from 'three/addons/libs/lil-gui.module.min.js'

    /* ---------- 基础环境 ---------- */
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100)
    camera.position.set(0, 0, 9)
    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(innerWidth, innerHeight)
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5))
    renderer.setClearColor(0x0b0e14, 1)
    document.getElementById('app').appendChild(renderer.domElement)
    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.enablePan = false

    /* ---------- 半透明面板层 ---------- */
    const PANEL_GEO = new THREE.PlaneGeometry(3.2, 2.2)
    const group = new THREE.Group()
    scene.add(group)

    const layers = [] // { mesh, normalMat }

    // 固定种子的伪随机，保证每次打开看到同一叠面板
    let seed = 20261104
    function rnd() {
      seed = (seed * 1664525 + 1013904223) % 4294967296
      return seed / 4294967296
    }

    function buildLayers(count) {
      for (const { mesh, normalMat } of layers) {
        group.remove(mesh)
        normalMat.dispose()
      }
      layers.length = 0

      for (let i = 0; i < count; i++) {
        const hue = 0.5 + (i % 8) / 40
        const normalMat = new THREE.MeshBasicMaterial({
          color: new THREE.Color().setHSL(hue, 0.85, 0.58),
          transparent: true,
          opacity: 0.15,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        })
        const mesh = new THREE.Mesh(PANEL_GEO, normalMat)
        const a = i * 2.399 // 黄金角，均匀撒开
        const r = Math.sqrt(i / count) * 4.2
        mesh.position.set(
          Math.cos(a) * r * 1.1,
          Math.sin(a) * r * 0.62,
          -3 + (i % 5) * 1.4
        )
        mesh.rotation.set(
          (rnd() - 0.5) * 0.5,
          (rnd() - 0.5) * 0.7,
          (rnd() - 0.5) * 0.9
        )
        group.add(mesh)
        layers.push({ mesh, normalMat })
      }
    }

    /* ---------- 计数材质：每画一次往红通道加 1 ---------- */
    const countMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        void main() {
          gl_FragColor = vec4(1.0, 0.0, 0.0, 1.0);
        }
      `,
      transparent: true,
      depthTest: false,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide
    })

    /* ---------- 计数缓冲与上色 ---------- */
    const rt = new THREE.WebGLRenderTarget(1, 1, {
      type: THREE.HalfFloatType,
      minFilter: THREE.NearestFilter,
      magFilter: THREE.NearestFilter,
      depthBuffer: false,
      stencilBuffer: false
    })

    const quadScene = new THREE.Scene()
    const quadCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1)
    const quadMat = new THREE.ShaderMaterial({
      uniforms: {
        uCount: { value: rt.texture },
        uMax: { value: 8.0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D uCount;
        uniform float uMax;

        vec3 heat(float t) {
          vec3 c0 = vec3(0.02, 0.03, 0.07);
          vec3 c1 = vec3(0.05, 0.25, 0.85);
          vec3 c2 = vec3(0.0, 0.95, 0.80);
          vec3 c3 = vec3(1.0, 0.90, 0.15);
          vec3 c4 = vec3(1.0, 0.12, 0.06);
          if (t < 0.25) return mix(c0, c1, t / 0.25);
          if (t < 0.50) return mix(c1, c2, (t - 0.25) / 0.25);
          if (t < 0.75) return mix(c2, c3, (t - 0.50) / 0.25);
          return mix(c3, c4, (t - 0.75) / 0.25);
        }

        void main() {
          float count = texture2D(uCount, vUv).r;
          float t = count / uMax;
          gl_FragColor = vec4(heat(t), 1.0);
        }
      `,
      depthTest: false,
      depthWrite: false
    })
    quadScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), quadMat))

    const clearColor = new THREE.Color(0x0b0e14)

    /* ---------- overdraw 估算：屏幕覆盖率求和 ---------- */
    const CORNERS = [
      new THREE.Vector2(-1.6, -1.1),
      new THREE.Vector2(1.6, -1.1),
      new THREE.Vector2(1.6, 1.1),
      new THREE.Vector2(-1.6, 1.1)
    ]
    const tmpV = new THREE.Vector3()

    function estimateOverdraw() {
      camera.updateMatrixWorld()
      let sum = 0
      for (const { mesh } of layers) {
        const pts = CORNERS.map(c => {
          tmpV.set(c.x, c.y, 0).applyMatrix4(mesh.matrixWorld).project(camera)
          return { x: tmpV.x, y: tmpV.y }
        })
        let area = 0
        for (let i = 0; i < 4; i++) {
          const a = pts[i]
          const b = pts[(i + 1) % 4]
          area += a.x * b.y - b.x * a.y
        }
        sum += Math.min(Math.abs(area) / 2 / 4, 1) // NDC 总面积是 4
      }
      return sum
    }

    /* ---------- GUI ---------- */
    const params = {
      mode: 'Overdraw 热力图',
      panelCount: 24,
      autoRotate: true
    }
    const gui = new GUI({ title: '渲染模式' })
    gui.add(params, 'mode', ['正常渲染', 'Overdraw 热力图']).name('看法')
    gui.add(params, 'panelCount', 8, 48, 2).name('面板层数').onChange(v => buildLayers(v))
    gui.add(params, 'autoRotate').name('整体旋转')

    buildLayers(params.panelCount)

    /* ---------- 尺寸 ---------- */
    function resizeTargets() {
      const size = renderer.getDrawingBufferSize(new THREE.Vector2())
      rt.setSize(Math.max(2, Math.floor(size.x * 0.75)), Math.max(2, Math.floor(size.y * 0.75)))
    }
    resizeTargets()

    /* ---------- HUD ---------- */
    const hud = {
      avg: document.getElementById('hudAvg'),
      frags: document.getElementById('hudFrags'),
      base: document.getElementById('hudBase'),
      panels: document.getElementById('hudPanels'),
      calls: document.getElementById('hudCalls'),
      fps: document.getElementById('hudFps')
    }

    const timer = new THREE.Timer()
    timer.connect(document)
    let frames = 0
    let lastTick = performance.now()
    let lastSample = performance.now()
    let avgOverdraw = 1
    let sceneCalls = 0

    function refreshHud() {
      const size = renderer.getDrawingBufferSize(new THREE.Vector2())
      const pixels = size.x * size.y / 1e6
      avgOverdraw = estimateOverdraw()
      const frags = pixels * avgOverdraw
      hud.avg.textContent = avgOverdraw.toFixed(2)
      hud.frags.textContent = frags.toFixed(2)
      hud.base.textContent = pixels.toFixed(2)
      hud.panels.textContent = layers.length
      hud.calls.textContent = sceneCalls
      hud.fps.textContent = Math.round(frames * 1000 / (performance.now() - lastTick))
      frames = 0
      lastTick = performance.now()
    }

    /* ---------- 主循环 ---------- */
    renderer.setAnimationLoop(() => {
      timer.update()
      const dt = Math.min(timer.getDelta(), 0.05)
      if (params.autoRotate) group.rotation.y += dt * 0.14
      controls.update()

      const heat = params.mode === 'Overdraw 热力图'

      // 面板着色：正常模式用彩色半透明，热力图模式换成计数材质
      for (const { mesh, normalMat } of layers) {
        mesh.material = heat ? countMat : normalMat
      }

      if (heat) {
        quadMat.uniforms.uMax.value = Math.max(8, avgOverdraw * 2.5)
        scene.background = null // 计数缓冲要干净地从 0 开始
        renderer.setRenderTarget(rt)
        renderer.setClearColor(0x000000, 1)
        renderer.render(scene, camera)
        sceneCalls = renderer.info.render.calls
        renderer.setRenderTarget(null)
        scene.background = clearColor
        renderer.setClearColor(clearColor, 1)
        renderer.render(quadScene, quadCamera)
      } else {
        renderer.render(scene, camera)
        sceneCalls = renderer.info.render.calls
      }

      frames++
      const now = performance.now()
      if (now - lastSample >= 600) {
        lastSample = now
        refreshHud()
      }
    })

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
      resizeTargets()
    })
  </script>
</body>

</html>
