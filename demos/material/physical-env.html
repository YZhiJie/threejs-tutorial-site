<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>physical-env · 物理材质与环境贴图</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .info {
      position: fixed; top: 14px; left: 14px; max-width: 350px;
      padding: 12px 14px; background: rgba(11,14,20,.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
      font-size: 13px; line-height: 1.65; pointer-events: none;
    }
    .info b { color: #7cc4ff; }
    .hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; background: rgba(11,14,20,.72);
      border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
      font-size: 12px; color: #9fb4d4; pointer-events: none; white-space: nowrap;
    }
    .lil-gui.root { --width: 270px; }
    @media (max-width: 600px) { .info { max-width: 200px; font-size: 12px; } .lil-gui.root { --width: 190px; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="info">
    <b>MeshPhysicalMaterial + 环境贴图</b><br />
    RoomEnvironment 是程序化生成的“摄影棚”环境，经 PMREM 处理后赋给
    scene.environment，金属/清漆/玻璃就能反射周围。<br />
    球后彩色柱用于观察 transmission 透射折射。
  </div>
  <div class="hint">调节 clearcoat（清漆）与 transmission（透射）对比质感</div>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
    import GUI from 'three/addons/libs/lil-gui.module.min.js'

    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x10141c)

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100)
    camera.position.set(0, 1.4, 5.2)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(innerWidth, innerHeight)
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1
    document.getElementById('app').appendChild(renderer.domElement)
    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true

    // 程序化摄影棚环境 → PMREM 预处理 → 场景环境贴图
    const pmrem = new THREE.PMREMGenerator(renderer)
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture

    // 地面
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshStandardMaterial({ color: 0x1b2230, roughness: 0.8, metalness: 0.2 })
    )
    ground.rotation.x = -Math.PI / 2
    ground.position.y = -0.85
    scene.add(ground)

    // 球后的彩色柱（为透射/反射提供内容）
    const pillarColors = [0xef4444, 0xf59e0b, 0x22c55e, 0x3b82f6, 0xa855f7]
    pillarColors.forEach((c, i) => {
      const p = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.16, 2.4, 24),
        new THREE.MeshStandardMaterial({ color: c, roughness: 0.4 })
      )
      const a = (i / pillarColors.length) * Math.PI * 2
      p.position.set(Math.cos(a) * 1.9, 0.35, Math.sin(a) * 1.9 - 0.6)
      scene.add(p)
    })

    const material = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.15,
      metalness: 0,
      clearcoat: 0.5,
      clearcoatRoughness: 0.1,
      transmission: 0,
      thickness: 0.8,
      ior: 1.5,
      envMapIntensity: 1
    })
    const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), material)
    ball.position.y = 0.35
    scene.add(ball)

    const params = {
      roughness: 0.15,
      metalness: 0,
      clearcoat: 0.5,
      clearcoatRoughness: 0.1,
      transmission: 0,
      thickness: 0.8,
      ior: 1.5,
      envMapIntensity: 1
    }
    const gui = new GUI({ title: 'PhysicalMaterial' })
    gui.add(params, 'roughness', 0, 1, 0.01).onChange(v => material.roughness = v)
    gui.add(params, 'metalness', 0, 1, 0.01).onChange(v => material.metalness = v)
    gui.add(params, 'clearcoat', 0, 1, 0.01).name('clearcoat 清漆').onChange(v => material.clearcoat = v)
    gui.add(params, 'clearcoatRoughness', 0, 1, 0.01).onChange(v => material.clearcoatRoughness = v)
    gui.add(params, 'transmission', 0, 1, 0.01).name('transmission 透射').onChange(v => material.transmission = v)
    gui.add(params, 'thickness', 0, 3, 0.05).name('thickness 厚度').onChange(v => material.thickness = v)
    gui.add(params, 'ior', 1, 2.3, 0.01).name('ior 折射率').onChange(v => material.ior = v)
    gui.add(params, 'envMapIntensity', 0, 3, 0.05).name('环境反射强度').onChange(v => material.envMapIntensity = v)

    renderer.setAnimationLoop(() => {
      ball.rotation.y += 0.004
      controls.update()
      renderer.render(scene, camera)
    })

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
    })
  </script>
</body>
</html>
