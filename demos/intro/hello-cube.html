<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hello-cube · 第一个 Three.js 场景</title>
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #0b0e14; color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .info {
      position: fixed; top: 14px; left: 14px; max-width: 300px;
      padding: 12px 14px; background: rgba(11,14,20,.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
      font-size: 13px; line-height: 1.65; pointer-events: none;
    }
    .info b { color: #7cc4ff; }
    .hint {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; background: rgba(11,14,20,.72);
      border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
      font-size: 12px; color: #9fb4d4; pointer-events: none; white-space: nowrap;
    }
    @media (max-width: 600px) { .info { max-width: 210px; font-size: 12px; } }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="info">
    <b>hello-cube</b><br />
    一个场景（Scene）+ 一台相机（Camera）+ 一个渲染器（Renderer），
    立方体使用 MeshNormalMaterial（按法线着色，无需灯光）。
  </div>
  <div class="hint">拖拽旋转视角 · 滚轮缩放 · 右键平移</div>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'

    // 1. 场景：所有 3D 物体的“容器”
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)

    // 2. 相机：决定从哪里、以什么视角观察场景
    const camera = new THREE.PerspectiveCamera(
      50, window.innerWidth / window.innerHeight, 0.1, 100
    )
    camera.position.set(3, 2, 4)

    // 3. 渲染器：把场景画到 <canvas> 上
    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(window.innerWidth, window.innerHeight)
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    document.getElementById('app').appendChild(renderer.domElement)

    // 鼠标控制器（平移/缩放/旋转）
    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true

    // 4. 几何体（形状）+ 材质（外观）= 网格 Mesh
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 1.4, 1.4),
      new THREE.MeshNormalMaterial()
    )
    scene.add(cube)

    // 5. 渲染循环：每一帧更新状态并重新渲染
    renderer.setAnimationLoop(() => {
      cube.rotation.x += 0.01
      cube.rotation.y += 0.012
      controls.update()
      renderer.render(scene, camera)
    })

    // 6. 窗口尺寸变化时自适应
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })
  </script>
</body>
</html>
