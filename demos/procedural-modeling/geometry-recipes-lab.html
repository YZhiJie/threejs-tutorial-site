<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>geometry-recipes-lab · 程序化几何配方台</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .info {
      position: fixed;
      top: 14px;
      left: 14px;
      max-width: 384px;
      padding: 12px 14px;
      background: rgba(11, 14, 20, .78);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.65;
      pointer-events: none;
    }

    .info b {
      color: #7cc4ff;
    }

    .info .stats {
      display: block;
      margin-top: 6px;
      color: #fbbf24;
      font-family: 'SF Mono', Consolas, monospace;
      font-size: 12px;
    }

    .info .desc {
      display: block;
      margin-top: 4px;
      color: #9fb4d4;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(11, 14, 20, .72);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: none;
      white-space: nowrap;
    }

    .lil-gui.root {
      --width: 262px;
    }

    @media (max-width: 600px) {
      .info {
        max-width: 206px;
        font-size: 12px;
      }

      .lil-gui.root {
        --width: 190px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <div class="info">
    <b>程序化几何配方台</b><br />
    参数 → 顶点 / 索引 / 法线 / 颜色，全部在 JS 里算出来。<br />
    <span class="desc" id="desc"></span>
    <span class="stats" id="stats"></span>
  </div>
  <div class="hint">右上角切换配方与参数 · 拖拽旋转视角 · 滚轮缩放</div>

  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import GUI from 'three/addons/libs/lil-gui.module.min.js'

    /* ---------- 基础渲染器 ---------- */
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100)
    camera.position.set(4.6, 3.6, 5.4)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(innerWidth, innerHeight)
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.outputColorSpace = THREE.SRGBColorSpace
    renderer.toneMapping = THREE.ACESFilmicToneMapping
    renderer.toneMappingExposure = 1.05
    document.getElementById('app').appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.target.set(0, 0.35, 0)
    controls.minDistance = 2.4
    controls.maxDistance = 16

    /* ---------- 灯光与辅助线 ---------- */
    scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x1b2333, 1.1))
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2)
    dirLight.position.set(4, 7, 5)
    scene.add(dirLight)
    const rim = new THREE.DirectionalLight(0xa78bfa, 1.1)
    rim.position.set(-5, 3, -4)
    scene.add(rim)

    const grid = new THREE.GridHelper(7, 14, 0x334155, 0x1c2638)
    grid.position.y = -1.35
    scene.add(grid)

    /* ---------- 伪随机与噪声 ---------- */
    function mulberry32(seed) {
      let a = seed >>> 0
      return function () {
        a = (a + 0x6D2B79F5) >>> 0
        let t = Math.imul(a ^ (a >>> 15), 1 | a)
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296
      }
    }

    function hash2(ix, iy, seed) {
      let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041)
      h = Math.imul(h ^ (h >>> 13), 1274126177)
      h ^= h >>> 16
      return (h >>> 0) / 4294967296
    }

    function hash3(ix, iy, iz, seed) {
      let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) +
        Math.imul(iz, 2147483647) + Math.imul(seed, 1442695041)
      h = Math.imul(h ^ (h >>> 13), 1274126177)
      h ^= h >>> 16
      return (h >>> 0) / 4294967296
    }

    const smooth = (t) => t * t * (3 - 2 * t)

    function vnoise2(x, y, seed) {
      const xi = Math.floor(x)
      const yi = Math.floor(y)
      const xf = x - xi
      const yf = y - yi
      const u = smooth(xf)
      const v = smooth(yf)
      const a = hash2(xi, yi, seed)
      const b = hash2(xi + 1, yi, seed)
      const c = hash2(xi, yi + 1, seed)
      const d = hash2(xi + 1, yi + 1, seed)
      return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v
    }

    function vnoise3(x, y, z, seed) {
      const xi = Math.floor(x)
      const yi = Math.floor(y)
      const zi = Math.floor(z)
      const xf = x - xi
      const yf = y - yi
      const zf = z - zi
      const u = smooth(xf)
      const v = smooth(yf)
      const w = smooth(zf)
      const c000 = hash3(xi, yi, zi, seed)
      const c100 = hash3(xi + 1, yi, zi, seed)
      const c010 = hash3(xi, yi + 1, zi, seed)
      const c110 = hash3(xi + 1, yi + 1, zi, seed)
      const c001 = hash3(xi, yi, zi + 1, seed)
      const c101 = hash3(xi + 1, yi, zi + 1, seed)
      const c011 = hash3(xi, yi + 1, zi + 1, seed)
      const c111 = hash3(xi + 1, yi + 1, zi + 1, seed)
      const x00 = c000 * (1 - u) + c100 * u
      const x10 = c010 * (1 - u) + c110 * u
      const x01 = c001 * (1 - u) + c101 * u
      const x11 = c011 * (1 - u) + c111 * u
      const y0 = x00 * (1 - v) + x10 * v
      const y1 = x01 * (1 - v) + x11 * v
      return y0 * (1 - w) + y1 * w
    }

    function fbm2(x, y, seed, octaves = 4) {
      let sum = 0
      let amp = 0.5
      let freq = 1
      let norm = 0
      for (let i = 0; i < octaves; i++) {
        sum += amp * vnoise2(x * freq, y * freq, seed + i * 131)
        norm += amp
        amp *= 0.5
        freq *= 2
      }
      return sum / norm
    }

    function fbm3(x, y, z, seed, octaves = 3) {
      let sum = 0
      let amp = 0.5
      let freq = 1
      let norm = 0
      for (let i = 0; i < octaves; i++) {
        sum += amp * vnoise3(x * freq, y * freq, z * freq, seed + i * 131)
        norm += amp
        amp *= 0.5
        freq *= 2
      }
      return sum / norm
    }

    /* ---------- 颜色辅助 ---------- */
    const COL_A = new THREE.Color()
    const COL_B = new THREE.Color()
    const COL_TMP = new THREE.Color()

    function pushColor(colors, a, b, t) {
      COL_TMP.lerpColors(COL_A.set(a), COL_B.set(b), THREE.MathUtils.clamp(t, 0, 1))
      colors.push(COL_TMP.r, COL_TMP.g, COL_TMP.b)
    }

    /* ---------- 配方 ①：波浪平面 ---------- */
    function makeWavePlane(seg, seed, strength) {
      const geo = new THREE.PlaneGeometry(4.6, 4.6, seg, seg)
      geo.rotateX(-Math.PI / 2)
      const pos = geo.attributes.position
      const colors = []
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i)
        const z = pos.getZ(i)
        const y = strength * (
          Math.sin(x * 2.1 + seed * 0.13) * 0.55 +
          Math.cos(z * 2.4 + seed * 0.07) * 0.45 +
          Math.sin((x + z) * 3.2) * 0.22
        )
        pos.setY(i, y)
        pushColor(colors, 0x0e7490, 0xc4b5fd, (y + 1.1) / 2.2)
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
      geo.computeVertexNormals()
      return geo
    }

    /* ---------- 配方 ②：噪声地形 ---------- */
    function makeTerrain(seg, seed, strength) {
      const geo = new THREE.PlaneGeometry(4.6, 4.6, seg, seg)
      geo.rotateX(-Math.PI / 2)
      const pos = geo.attributes.position
      const colors = []
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i)
        const z = pos.getZ(i)
        const n = fbm2(x * 1.15 + 8.2, z * 1.15 - 3.7, seed)
        const ridge = Math.abs(fbm2(x * 2.8, z * 2.8, seed + 7) - 0.5) * 2
        const y = (n - 0.5) * strength * 3.4 + ridge * strength * 0.5
        pos.setY(i, y)
        const t = (y + 1.4) / 2.8
        if (t < 0.45) pushColor(colors, 0x0f2a4a, 0x1d6b5c, t / 0.45)
        else if (t < 0.75) pushColor(colors, 0x1d6b5c, 0x8aa35a, (t - 0.45) / 0.3)
        else pushColor(colors, 0x8aa35a, 0xe5d5b0, (t - 0.75) / 0.25)
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
      geo.computeVertexNormals()
      return geo
    }

    /* ---------- 配方 ③：环形坡道 ---------- */
    function makeRingRamp(seg, seed, strength) {
      const around = Math.max(64, seg * 2)
      const width = 4
      const r0 = 1.0
      const r1 = 2.6
      const positions = []
      const colors = []
      const uvs = []
      const indices = []

      for (let i = 0; i <= around; i++) {
        const t = i / around
        const ang = t * Math.PI * 2
        for (let j = 0; j < width; j++) {
          const v = j / (width - 1)
          const r = r0 + (r1 - r0) * v
          const base = -0.95 + t * 2.0
          const bump = fbm2(t * 7 + v * 2.3, v * 2.4, seed) * strength * 1.1
          const y = base + (bump - strength * 0.45)
          positions.push(Math.cos(ang) * r, y, Math.sin(ang) * r)
          uvs.push(t, v)
          pushColor(colors, 0x1d4ed8, 0x22d3ee, t)
        }
      }

      for (let i = 0; i < around; i++) {
        for (let j = 0; j < width - 1; j++) {
          const a = i * width + j
          const b = (i + 1) * width + j
          const c = (i + 1) * width + j + 1
          const d = i * width + j + 1
          indices.push(a, b, c, a, c, d)
        }
      }

      const geo = new THREE.BufferGeometry()
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3))
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2))
      geo.setIndex(indices)
      geo.computeVertexNormals()
      return geo
    }

    /* ---------- 配方 ④：程序化岩石球 ---------- */
    function makeRock(seg, seed, strength) {
      const geo = new THREE.SphereGeometry(1.42, Math.max(48, seg * 2), Math.max(32, seg))
      const pos = geo.attributes.position
      const colors = []
      const dir = new THREE.Vector3()
      for (let i = 0; i < pos.count; i++) {
        dir.fromBufferAttribute(pos, i).normalize()
        const n = fbm3(dir.x * 2.2 + 4.1, dir.y * 2.2, dir.z * 2.2, seed, 3)
        const detail = vnoise3(dir.x * 6.5, dir.y * 6.5, dir.z * 6.5, seed + 11)
        const radius = 1.42 * (1 + strength * ((n - 0.5) * 0.9 + (detail - 0.5) * 0.22))
        pos.setXYZ(i, dir.x * radius, dir.y * radius, dir.z * radius)
        pushColor(colors, 0x334155, 0xb08968, n)
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3))
      geo.computeVertexNormals()
      return geo
    }

    /* ---------- 场景对象 ---------- */
    const material = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.62,
      metalness: 0.08,
      side: THREE.DoubleSide
    })

    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material)
    mesh.position.y = 0.1
    scene.add(mesh)

    const wire = new THREE.LineSegments(
      new THREE.BufferGeometry(),
      new THREE.LineBasicMaterial({ color: 0x7cc4ff, transparent: true, opacity: 0.16 })
    )
    mesh.add(wire)

    const DESC = {
      '波浪平面': '解析式 sin / cos 直接改写顶点高度，最基础的程序化形变。',
      '噪声地形': 'value noise + fBm 叠加成高度场，再把高度映射成顶点色。',
      '环形坡道': '参数曲面：角度 → 半径与高度，手写索引拼成一条螺旋带。',
      '程序化岩石球': '球面顶点沿法向按 3D 噪声位移，再用 flatShading 强化块面感。'
    }

    const params = {
      recipe: '波浪平面',
      seed: 7,
      strength: 0.65,
      resolution: 64,
      wireframe: false,
      autoRotate: true
    }

    const statsEl = document.getElementById('stats')
    const descEl = document.getElementById('desc')

    function rebuild() {
      const seg = Math.round(params.resolution)
      const seed = Math.round(params.seed)
      const strength = params.strength
      let geo

      if (params.recipe === '波浪平面') geo = makeWavePlane(seg, seed, strength)
      else if (params.recipe === '噪声地形') geo = makeTerrain(seg, seed, strength)
      else if (params.recipe === '环形坡道') geo = makeRingRamp(seg, seed, strength)
      else geo = makeRock(seg, seed, strength)

      mesh.geometry.dispose()
      mesh.geometry = geo

      material.flatShading = params.recipe === '程序化岩石球'
      material.wireframe = params.wireframe
      material.needsUpdate = true

      const verts = geo.attributes.position.count
      const tris = geo.index ? geo.index.count / 3 : verts / 3
      const sizeKB = Math.round(
        (geo.attributes.position.array.byteLength +
          (geo.index ? geo.index.array.byteLength : 0)) / 1024
      )

      statsEl.textContent =
        `顶点 ${verts} · 三角 ${Math.round(tris)} · 顶点缓冲 ≈${sizeKB}KB · seed ${seed}`
      descEl.textContent = DESC[params.recipe]

      wire.geometry.dispose()
      wire.geometry = new THREE.WireframeGeometry(geo)
      wire.visible = params.wireframe
    }

    /* ---------- GUI ---------- */
    const gui = new GUI({ title: '几何配方' })
    gui.add(params, 'recipe', Object.keys(DESC)).name('生成器')
      .onChange(rebuild)
    gui.add(params, 'seed', 1, 200, 1).name('随机种子 seed').onChange(rebuild)
    gui.add(params, 'strength', 0, 1.6, 0.01).name('强度').onChange(rebuild)
    gui.add(params, 'resolution', 24, 128, 1).name('细分').onChange(rebuild)
    gui.add(params, 'wireframe').name('显示线框').onChange((v) => {
      material.wireframe = v
      wire.visible = v
    })
    gui.add(params, 'autoRotate').name('自动旋转')

    rebuild()

    /* ---------- 主循环 ---------- */
    const timer = new THREE.Timer()
    timer.connect(document)
    renderer.setAnimationLoop(() => {
      timer.update()
      const t = timer.getElapsed()
      if (params.autoRotate) mesh.rotation.y = t * 0.18
      controls.update()
      renderer.render(scene, camera)
    })

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
    })
  </script>
</body>

</html>
