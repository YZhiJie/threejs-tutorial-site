<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mini-game · 3D 闯关小游戏</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .info {
      position: fixed;
      top: 14px;
      left: 14px;
      max-width: 320px;
      padding: 12px 14px;
      background: rgba(11, 14, 20, .72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.65;
      pointer-events: none;
    }

    .info b {
      color: #7cc4ff;
    }

    .hud {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 18px;
      background: rgba(11, 14, 20, .72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      white-space: nowrap;
    }

    .hud b {
      color: #fbbf24;
    }

    .hud .d {
      color: #f87171;
    }

    .hint {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      background: rgba(11, 14, 20, .72);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 999px;
      font-size: 12px;
      color: #9fb4d4;
      pointer-events: none;
      white-space: nowrap;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 14, 20, .55);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .overlay.show {
      display: flex;
    }

    .card {
      padding: 28px 44px;
      background: #111a30;
      border: 1px solid rgba(52, 211, 153, .45);
      border-radius: 16px;
      text-align: center;
      font-size: 15px;
      line-height: 2;
    }

    .card b {
      color: #34d399;
      font-size: 26px;
    }

    @media (max-width: 600px) {
      .info {
        max-width: 200px;
        font-size: 12px;
      }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>

<body>
  <div id="app"></div>
  <div class="info">
    <b>mini-game · 3D 闯关小游戏</b><br />
    跳上移动平台，吃满 8 枚金币，摸到绿色终点旗即通关。<br />
    走出边缘半秒内仍能跳（土狼时间）；落地前按跳会自动补跳（跳跃缓冲）。
  </div>
  <div class="hud" id="hud">金币 <b>0 / 8</b> · 时间 0.0s · 死亡 <span class="d">0</span></div>
  <div class="hint">WASD 移动 · 空格跳跃 · R 重新挑战</div>
  <div class="overlay" id="overlay">
    <div class="card">
      <b>通关！</b><br />
      <span id="winText">用时 0.0 秒</span><br />
      按 R 重新挑战
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three'
    import * as CANNON from 'cannon-es'

    /* ---------- 渲染世界 ---------- */
    const scene = new THREE.Scene()
    scene.background = new THREE.Color(0x0b0e14)
    scene.fog = new THREE.Fog(0x0b0e14, 40, 90)
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 150)
    camera.position.set(0, 6, 18)
    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setSize(innerWidth, innerHeight)
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
    renderer.shadowMap.enabled = true
    renderer.shadowMap.type = THREE.PCFSoftShadowMap
    document.getElementById('app').appendChild(renderer.domElement)

    scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x1a1a26, 0.9))
    const sun = new THREE.DirectionalLight(0xffffff, 1.8)
    sun.position.set(8, 18, 10)
    sun.castShadow = true
    sun.shadow.mapSize.set(1024, 1024)
    sun.shadow.camera.left = sun.shadow.camera.bottom = -35
    sun.shadow.camera.right = sun.shadow.camera.top = 35
    scene.add(sun)

    /* ---------- 物理世界 ---------- */
    const world = new CANNON.World()
    world.gravity.set(0, -9.82, 0)

    const matPlayer = new CANNON.Material('player')
    const matGround = new CANNON.Material('ground')
    world.addContactMaterial(new CANNON.ContactMaterial(matPlayer, matGround, {
      friction: 0.4, restitution: 0 // 角色↔平台：不打滑、不弹跳
    }))

    /* ---------- 音效：WebAudio 迷你合成器 ---------- */
    let audioCtx = null
    function beep(freq, dur, delay = 0) {
      if (!audioCtx) return
      const osc = audioCtx.createOscillator()
      const gain = audioCtx.createGain()
      osc.type = 'sine'
      osc.frequency.value = freq
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay)
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur)
      osc.connect(gain).connect(audioCtx.destination)
      osc.start(audioCtx.currentTime + delay)
      osc.stop(audioCtx.currentTime + delay + dur)
    }
    addEventListener('keydown', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    }, { once: false })

    /* ---------- 关卡：静态平台 ---------- */
    const boxGeo = new THREE.BoxGeometry(1, 1, 1)
    function addPlatform(x, top, z, w, h, d, color = 0x334155) {
      const mesh = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.8 }))
      mesh.scale.set(w, h, d)
      mesh.position.set(x, top - h / 2, z) // 数据记"顶面"，Mesh/Body 用中心
      mesh.castShadow = mesh.receiveShadow = true
      scene.add(mesh)
      const body = new CANNON.Body({
        type: CANNON.Body.STATIC,
        shape: new CANNON.Box(new CANNON.Vec3(w / 2, h / 2, d / 2)),
        position: new CANNON.Vec3(x, top - h / 2, z),
        material: matGround
      })
      world.addBody(body)
      return body
    }

    addPlatform(0, 0, 8, 8, 1, 6, 0x2a3a55)        // 出生台
    addPlatform(0, 1, 0, 3, 0.6, 3)                // 跳跃平台一
    addPlatform(4, 2, -8, 3, 0.6, 3, 0x3b3f5c)     // 金币平台
    addPlatform(0, 3, -19, 3, 0.6, 3)              // 终点前哨
    addPlatform(0, 3.5, -27, 6, 1, 6, 0x1e4d3b)    // 终点台

    /* ---------- 移动机关：kinematic 平台 ---------- */
    const movers = []
    function addMover(x, y, z, axis, range, speed) {
      const mesh = new THREE.Mesh(boxGeo, new THREE.MeshStandardMaterial({
        color: 0x7c3aed, roughness: 0.5, emissive: 0x2e1065
      }))
      mesh.scale.set(3, 0.3, 3)
      mesh.position.set(x, y, z)
      mesh.castShadow = mesh.receiveShadow = true
      scene.add(mesh)
      const body = new CANNON.Body({
        type: CANNON.Body.KINEMATIC,   // 运动学刚体：代码驱动速度，物理上仍能载人
        shape: new CANNON.Box(new CANNON.Vec3(1.5, 0.15, 1.5)),
        position: new CANNON.Vec3(x, y, z),
        material: matGround
      })
      world.addBody(body)
      movers.push({ mesh, body, axis, range, speed, phase: Math.random() * Math.PI * 2 })
    }
    addMover(0, 1.35, -4, 'x', 3, 0.9)   // 平台一 → 金币平台：横向摆渡
    addMover(0, 2.35, -14, 'z', 2, 0.8)  // 金币平台 → 前哨：纵向摆渡

    /* ---------- 金币：感应体 ---------- */
    const coins = []
    const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.08, 24)
    const coinMat = new THREE.MeshStandardMaterial({
      color: 0xfbbf24, metalness: 0.8, roughness: 0.25, emissive: 0x78590a
    })
    const COIN_SPOTS = [
      [0, 2, 0], [3, 3, -8], [4, 3, -8], [5, 3, -8],
      [0, 3.5, -14], [-0.8, 4, -19], [0.8, 4, -19], [0, 4.5, -22]
    ]
    function addCoin(x, y, z) {
      const mesh = new THREE.Mesh(coinGeo, coinMat)
      mesh.rotation.z = Math.PI / 2   // 竖起来像金币
      mesh.position.set(x, y, z)
      mesh.castShadow = true
      scene.add(mesh)
      const body = new CANNON.Body({
        type: CANNON.Body.STATIC,
        shape: new CANNON.Sphere(0.5),
        position: new CANNON.Vec3(x, y, z),
        collisionResponse: false      // 感应体：只发事件，不弹开玩家
      })
      world.addBody(body)
      const coin = { mesh, body, taken: false }
      body.userData = { kind: 'coin', coin }
      coins.push(coin)
    }
    COIN_SPOTS.forEach(([x, y, z]) => addCoin(x, y, z))

    /* ---------- 终点：旗 + 感应区 ---------- */
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 2.4, 10),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0 })
    )
    pole.position.set(0, 4.7, -28)
    scene.add(pole)
    const flag = new THREE.Mesh(
      new THREE.ConeGeometry(0.45, 0.9, 4),
      new THREE.MeshStandardMaterial({ color: 0x34d399, emissive: 0x0a3d28 })
    )
    flag.rotation.z = -Math.PI / 2
    flag.position.set(0.55, 5.6, -28)
    scene.add(flag)

    const flagBody = new CANNON.Body({
      type: CANNON.Body.STATIC,
      shape: new CANNON.Box(new CANNON.Vec3(2.5, 2, 2.5)),
      position: new CANNON.Vec3(0, 4.5, -27),
      collisionResponse: false        // 终点线也是感应区
    })
    world.addBody(flagBody)

    /* ---------- 角色：胶囊刚体（同 23.2 配方） ---------- */
    const R = 0.35
    const SPAWN = new CANNON.Vec3(0, 1.5, 8)
    const playerBody = new CANNON.Body({
      mass: 5, material: matPlayer, fixedRotation: true
    })
    playerBody.updateMassProperties()
    playerBody.addShape(new CANNON.Sphere(R), new CANNON.Vec3(0, 0.45, 0))
    playerBody.addShape(new CANNON.Sphere(R), new CANNON.Vec3(0, 0, 0))
    playerBody.addShape(new CANNON.Sphere(R), new CANNON.Vec3(0, -0.45, 0))
    playerBody.collisionFilterGroup = 2
    playerBody.position.copy(SPAWN)
    world.addBody(playerBody)

    const playerMesh = new THREE.Mesh(
      new THREE.CapsuleGeometry(R, 0.9, 8, 16),
      new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.5 })
    )
    playerMesh.castShadow = true
    scene.add(playerMesh)
    playerMesh.position.copy(SPAWN)

    /* ---------- 游戏状态 ---------- */
    const hud = document.getElementById('hud')
    const overlay = document.getElementById('overlay')
    const winText = document.getElementById('winText')
    let score = 0, deaths = 0, won = false, startTime = 0

    function updateHUD(t) {
      hud.innerHTML = `金币 <b>${score} / ${coins.length}</b> · 时间 ${(t - startTime).toFixed(1)}s · 死亡 <span class="d">${deaths}</span>`
    }

    function respawn() {
      playerBody.position.copy(SPAWN)
      playerBody.velocity.set(0, 0, 0)
      playerBody.angularVelocity.set(0, 0, 0)
    }

    function resetGame(t) {
      score = 0; deaths = 0; won = false; startTime = t
      overlay.classList.remove('show')
      coins.forEach(c => {
        if (c.taken) {          // 把被吃掉的金币加回来
          c.taken = false
          scene.add(c.mesh)
          world.addBody(c.body)
        }
      })
      respawn()
    }

    /* ---------- 碰撞事件：金币收集 + 通关判定 ---------- */
    playerBody.addEventListener('collide', (e) => {
      const data = e.body.userData
      if (data && data.kind === 'coin' && !data.coin.taken) {
        const coin = data.coin
        coin.taken = true               // 先置位去重，再下架
        scene.remove(coin.mesh)
        world.removeBody(coin.body)
        score++
        beep(880, 0.08)
      }
      if (e.body === flagBody && !won) {
        won = true
        winText.textContent = `用时 ${(timer.getElapsed() - startTime).toFixed(1)} 秒 · 死亡 ${deaths} 次`
        overlay.classList.add('show')
        beep(523, 0.12); beep(784, 0.25, 0.12) // 两音上扬的小胜利旋律
      }
    })

    /* ---------- 键盘 ---------- */
    const keys = { w: false, a: false, s: false, d: false }
    const KEYMAP = { KeyW: 'w', KeyA: 'a', KeyS: 's', KeyD: 'd' }
    let lastJumpPress = -1
    addEventListener('keydown', (e) => {
      const k = KEYMAP[e.code]
      if (k) { keys[k] = true; e.preventDefault() }
      if (e.code === 'Space') { lastJumpPress = timer.getElapsed(); e.preventDefault() }
      if (e.code === 'KeyR') resetGame(timer.getElapsed())
    })
    addEventListener('keyup', (e) => {
      const k = KEYMAP[e.code]
      if (k) keys[k] = false
    })

    /* ---------- 地面检测 ---------- */
    const rayTo = new CANNON.Vec3()
    const rayHit = new CANNON.RaycastResult()
    function isOnGround() {
      const p = playerBody.position
      rayTo.set(p.x, p.y - 0.95, p.z)
      rayHit.reset()
      return world.raycastClosest(p, rayTo, {
        collisionFilterMask: 1, skipBackfaces: true
      }, rayHit)
    }

    /* ---------- 手感：土狼时间 + 跳跃缓冲 ---------- */
    const COYOTE = 0.12   // 走出边缘后 0.12s 内仍算在地
    const BUFFER = 0.15   // 落地前 0.15s 内按跳会缓冲补跳
    let lastGrounded = -1

    /* ---------- 相机 ---------- */
    const desiredCam = new THREE.Vector3()
    const lookTarget = new THREE.Vector3()
    const UP = new THREE.Vector3(0, 1, 0)

    /* ---------- 主循环 ---------- */
    const SPEED = 5
    const JUMP_SPEED = 7.5
    const timer = new THREE.Timer()
    timer.connect(document)
    renderer.setAnimationLoop(() => {
      timer.update()
      const dt = Math.min(timer.getDelta(), 0.05)
      const t = timer.getElapsed()

      // ① 输入 → 相机相对方向
      const input = new THREE.Vector3(
        (keys.d ? 1 : 0) - (keys.a ? 1 : 0), 0,
        (keys.s ? 1 : 0) - (keys.w ? 1 : 0)
      )
      if (input.lengthSq() > 0) {
        input.normalize()
        const yaw = Math.atan2(
          camera.position.x - playerBody.position.x,
          camera.position.z - playerBody.position.z
        )
        input.applyAxisAngle(UP, yaw)
      }

      // ② 土狼时间 + 跳跃缓冲
      if (!won) {
        if (isOnGround()) lastGrounded = t
        const canJump = (t - lastGrounded) < COYOTE
        const wantJump = (t - lastJumpPress) < BUFFER
        if (canJump && wantJump) {
          playerBody.velocity.y = JUMP_SPEED
          lastJumpPress = -1     // 消费缓冲
          lastGrounded = -1      // 防止土狼时间内二次起跳
          beep(300, 0.08)
        }
        playerBody.velocity.x = input.x * SPEED
        playerBody.velocity.z = input.z * SPEED
      }

      // ③ 机关：正弦速度驱动（位置由引擎积分，摩擦才是真的）
      movers.forEach(m => {
        const v = Math.cos(t * m.speed + m.phase) * m.range * m.speed
        m.body.velocity.set(m.axis === 'x' ? v : 0, 0, m.axis === 'z' ? v : 0)
      })

      // ④ 物理推进 + 同步
      world.step(1 / 60, dt, 3)
      playerMesh.position.copy(playerBody.position)
      movers.forEach(m => m.mesh.position.copy(m.body.position))
      coins.forEach(c => { if (!c.taken) c.mesh.rotation.y += dt * 2 })
      flag.rotation.y += dt * 1.5

      // ⑤ 掉落重生
      if (playerBody.position.y < -8) {
        respawn()
        deaths++
        beep(150, 0.2)
      }

      // ⑥ 相机跟随
      desiredCam.set(
        playerBody.position.x,
        playerBody.position.y + 4.5,
        playerBody.position.z + 7.5
      )
      camera.position.lerp(desiredCam, 1 - Math.pow(0.001, dt))
      lookTarget.set(playerMesh.position.x, playerMesh.position.y + 1, playerMesh.position.z)
      camera.lookAt(lookTarget)

      if (!won) updateHUD(t)
      renderer.render(scene, camera)
    })

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(innerWidth, innerHeight)
    })
  </script>
</body>

</html>
